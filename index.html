      { id: 'ZONE_1', name: 'Zone 1: North Ridge Residential' },
      { id: 'ZONE_2', name: 'Zone 2: Central Commercial Core' },
      { id: 'ZONE_3', name: 'Zone 3: CyberCity Tech Park' },
      { id: 'ZONE_4', name: 'Zone 4: Industrial East Corridor' },
      { id: 'ZONE_5', name: 'Zone 5: South Sanitation Basin' }
    ];

    // Status color helper
    const getStatusStyle = (status) => {
      switch (status) {
        case 'NORMAL':
          return { bg: 'bg-emerald-500/10', text: 'text-emerald-400', border: 'border-emerald-500/30', stroke: '#10B981', label: 'Normal Operations' };
        case 'MICRO_LEAK':
          return { bg: 'bg-amber-500/10', text: 'text-amber-400', border: 'border-amber-500/30', stroke: '#F59E0B', label: 'Micro-leak Suspected' };
        case 'CRITICAL_BURST':
          return { bg: 'bg-red-500/15', text: 'text-red-400', border: 'border-red-500/40', stroke: '#EF4444', label: 'Critical Pipe Burst' };
        case 'CONTAMINATION_BLOCKAGE':
          return { bg: 'bg-purple-500/15', text: 'text-purple-400', border: 'border-purple-500/40', stroke: '#A855F7', label: 'Contamination / Blockage' };
        default:
          return { bg: 'bg-slate-500/10', text: 'text-slate-400', border: 'border-slate-500/30', stroke: '#94A3B8', label: status };
      }
    };

    const getSeverityBadge = (severity) => {
      switch (severity) {
        case 'CRITICAL': return <span className="px-2 py-0.5 text-xs font-semibold rounded bg-red-500/20 text-red-400 border border-red-500/30 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-red-400 animate-ping"></span>Critical</span>;
        case 'HIGH': return <span className="px-2 py-0.5 text-xs font-semibold rounded bg-orange-500/20 text-orange-400 border border-orange-500/30">High</span>;
        case 'MEDIUM': return <span className="px-2 py-0.5 text-xs font-semibold rounded bg-amber-500/20 text-amber-400 border border-amber-500/30">Medium</span>;
        case 'LOW': return <span className="px-2 py-0.5 text-xs font-semibold rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">Low</span>;
        default: return <span className="px-2 py-0.5 text-xs font-semibold rounded bg-slate-500/20 text-slate-400">Info</span>;
      }
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      // Navigation tab
      const [activeTab, setActiveTab] = useState('overview');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      // Filters & Search
      const [selectedZone, setSelectedZone] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [timeRange, setTimeRange] = useState('24h');

      // State stores (persisted to localStorage)
      const [nodes, setNodes] = useState(() => {
        const saved = localStorage.getItem('pipegraph_nodes');
        return saved ? JSON.parse(saved) : RAW_NODES;
      });
      const [pipes, setPipes] = useState(() => {
        const saved = localStorage.getItem('pipegraph_pipes');
        return saved ? JSON.parse(saved) : RAW_PIPES;
      });
      const [anomalies, setAnomalies] = useState(() => {
        const saved = localStorage.getItem('pipegraph_anomalies');
        return saved ? JSON.parse(saved) : RAW_ANOMALIES;
      });
      const [workOrders, setWorkOrders] = useState(() => {
        const saved = localStorage.getItem('pipegraph_workorders');
        return saved ? JSON.parse(saved) : RAW_WORK_ORDERS;
      });
      const [contaminationPaths, setContaminationPaths] = useState(() => {
        const saved = localStorage.getItem('pipegraph_contamination');
        return saved ? JSON.parse(saved) : RAW_CONTAMINATION_PATHS;
      });

      // Settings
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('pipegraph_settings');
        return saved ? JSON.parse(saved) : {
          unitWaterCostInr: 22.50,
          fluidDensity: 1000,
          gravity: 9.81,
          anomalyZThreshold: 2.0,
          liveTickerSpeed: '1X',
          activeZoneFilter: 'ALL'
        };
      });

      // Interactive Selection
      const [selectedPipeId, setSelectedPipeId] = useState('P-108'); // default focus on burst
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const [isDetailDrawerOpen, setIsDetailDrawerOpen] = useState(true);

      // Map View Settings
      const [layerWater, setLayerWater] = useState(true);
      const [layerSewer, setLayerSewer] = useState(true);
      const [layerPressureHeatmap, setLayerPressureHeatmap] = useState(false);
      const [layerFlowArrows, setLayerFlowArrows] = useState(true);
      const [layerAnomalies, setLayerAnomalies] = useState(true);

      // Modals
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showInjectModal, setShowInjectModal] = useState(false);
      const [showWorkOrderModal, setShowWorkOrderModal] = useState(false);
      const [workOrderInitialData, setWorkOrderInitialData] = useState(null);
      const [resolveModalData, setResolveModalData] = useState(null);
      const [printPreviewMode, setPrintPreviewMode] = useState(false);

      // Interactive Mathematical Simulator state for selected item
      const [simulatedPressureSlider, setSimulatedPressureSlider] = useState(1.55);

      // Toasts
      const [toasts, setToasts] = useState([]);
      const addToast = (title, message, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      // Sync to localStorage
      useEffect(() => {
        localStorage.setItem('pipegraph_nodes', JSON.stringify(nodes));
        localStorage.setItem('pipegraph_pipes', JSON.stringify(pipes));
        localStorage.setItem('pipegraph_anomalies', JSON.stringify(anomalies));
        localStorage.setItem('pipegraph_workorders', JSON.stringify(workOrders));
        localStorage.setItem('pipegraph_settings', JSON.stringify(settings));
      }, [nodes, pipes, anomalies, workOrders, settings]);

      // Selected pipe object
      const selectedPipe = useMemo(() => {
        return pipes.find(p => p.id === selectedPipeId) || pipes[0];
      }, [pipes, selectedPipeId]);

      // Update simulation slider when selected pipe changes
      useEffect(() => {
        if (selectedPipe) {
          setSimulatedPressureSlider(selectedPipe.actualPressureDownstream);
        }
      }, [selectedPipeId]);

      // Upstream & Downstream Lineage for selected pipe
      const lineage = useMemo(() => {
        if (!selectedPipe) return { upstreamPipes: [], downstreamPipes: [], upstreamNodes: [], downstreamNodes: [] };
        const upPipes = pipes.filter(p => p.toNodeId === selectedPipe.fromNodeId).map(p => p.id);
        const downPipes = pipes.filter(p => p.fromNodeId === selectedPipe.toNodeId).map(p => p.id);
        return {
          upstreamPipes: upPipes,
          downstreamPipes: downPipes,
          upstreamNodes: [selectedPipe.fromNodeId],
          downstreamNodes: [selectedPipe.toNodeId]
        };
      }, [selectedPipe, pipes]);

      // Mathematical calculations for current selected pipe and simulated slider
      const mathAnalysis = useMemo(() => {
        if (!selectedPipe) return null;
        const expectedP = selectedPipe.expectedPressureDownstream;
        const actualP = Number(simulatedPressureSlider);
        const sigma = selectedPipe.pressureSigma || 0.25;
        const deltaP = Number((actualP - expectedP).toFixed(3));
        const zScore = Number((deltaP / sigma).toFixed(2));
        
        let classification = 'NORMAL';
        let leakRate = 0;
        let explanation = '';

        if (actualP <= 0.2 || (deltaP < -1.5 && actualP < 1.0)) {
          classification = 'CONTAMINATION_BLOCKAGE';
          leakRate = 12.5;
          explanation = `Sub-atmospheric pressure (${actualP.toFixed(2)} bar, z = ${zScore}σ). Severe hydraulic depression creates back-siphonage suction from adjacent groundwater or sewer lines.`;
        } else if (zScore <= -3.0 || deltaP <= -1.2) {
          classification = 'CRITICAL_BURST';
          leakRate = Number((Math.min(45, 12 + Math.abs(deltaP) * 10)).toFixed(1));
          explanation = `Major hydraulic collapse (${deltaP.toFixed(2)} bar drop, z = ${zScore}σ). Pressure profile indicates severe structural pipe rupture with massive water discharge.`;
        } else if (zScore <= -settings.anomalyZThreshold || deltaP <= -0.25) {
          classification = 'MICRO_LEAK';
          leakRate = Number((Math.min(8, 1.2 + Math.abs(deltaP) * 4)).toFixed(1));
          explanation = `Persistent pressure depression (${deltaP.toFixed(2)} bar, z = ${zScore}σ). Acoustic and headloss signature indicates joint leakage or pinhole failure.`;
        } else if (zScore >= settings.anomalyZThreshold && deltaP >= 0.6) {
          classification = 'CONTAMINATION_BLOCKAGE';
          leakRate = 0;
          explanation = `Abnormal upstream head accumulation (+${deltaP.toFixed(2)} bar, z = +${zScore}σ) alongside flow velocity reduction indicates internal hydraulic choking or blockage.`;
        } else {
          classification = 'NORMAL';
          leakRate = 0;
          explanation = `Operating normally within statistical confidence envelope (z = ${zScore}σ). Hydraulic head loss matches expected Darcy-Weisbach gradient.`;
        }

        const dailyLossM3 = Number((leakRate * 24).toFixed(1));
        const dailyCostInr = Math.round(dailyLossM3 * settings.unitWaterCostInr);

        return {
          expectedP,
          actualP,
          deltaP,
          zScore,
          classification,
          leakRate,
          dailyLossM3,
          dailyCostInr,
          explanation
        };
      }, [selectedPipe, simulatedPressureSlider, settings]);

      // KPI Aggregations
      const kpis = useMemo(() => {
        const totalLengthKm = Number((pipes.reduce((acc, p) => acc + p.length, 0) / 1000).toFixed(1));
        const monitoredPipes = pipes.length;
        const activeAnomalies = anomalies.filter(a => a.status !== 'RESOLVED').length;
        const totalLossRate = Number(pipes.reduce((acc, p) => acc + (p.leakageRate || 0), 0).toFixed(1));
        const dailyLossM3 = Number((totalLossRate * 24).toFixed(1));
        const dailyFinancial = Math.round(dailyLossM3 * settings.unitWaterCostInr);
        const monthlyFinancial = Math.round(dailyFinancial * 30);
        
        // Health score: 100 - (penalties for bursts, leaks, blockages)
        const burstCount = pipes.filter(p => p.status === 'CRITICAL_BURST').length;
        const leakCount = pipes.filter(p => p.status === 'MICRO_LEAK').length;
        const contamCount = pipes.filter(p => p.status === 'CONTAMINATION_BLOCKAGE').length;
        const healthScore = Math.max(60, Number((100 - (burstCount * 12) - (leakCount * 4) - (contamCount * 8)).toFixed(1)));

        return {
          totalLengthKm,
          monitoredPipes,
          activeAnomalies,
          totalLossRate,
          dailyFinancial,
          monthlyFinancial,
          healthScore,
          burstCount,
          leakCount,
          contamCount
        };
      }, [pipes, anomalies, settings]);

      // Handlers
      const handleAcknowledgeAnomaly = (anomId) => {
        setAnomalies(prev => prev.map(a => a.id === anomId ? { ...a, status: 'ACKNOWLEDGED' } : a));
        addToast('Alert Acknowledged', `Anomaly ${anomId} marked acknowledged.`, 'info');
      };

      const handleLocateOnMap = (pipeId) => {
        setSelectedPipeId(pipeId);
        setActiveTab('map');
        setIsDetailDrawerOpen(true);
        addToast('Map Focus', `Focused on pipe segment ${pipeId}.`, 'info');
      };

      const handleCreateWorkOrderFromAnomaly = (anomaly) => {
        setWorkOrderInitialData(anomaly);
        setShowWorkOrderModal(true);
      };

      const handleResolveAnomalyPrompt = (anomaly) => {
        setResolveModalData(anomaly);
      };

      const confirmResolveAnomaly = (notes) => {
        if (!resolveModalData) return;
        const anomId = resolveModalData.id;
        const pId = resolveModalData.pipeId;

        // Update anomaly
        setAnomalies(prev => prev.map(a => a.id === anomId ? { ...a, status: 'RESOLVED' } : a));
        // Update pipe to NORMAL
        setPipes(prev => prev.map(p => p.id === pId ? { ...p, status: 'NORMAL', leakageRate: 0, anomalyConfidence: 0 } : p));
        // Update work order if linked
        setWorkOrders(prev => prev.map(w => w.anomalyId === anomId ? { ...w, status: 'RESOLVED', resolutionNotes: notes || 'Remediated & pressure normalized.' } : w));

        addToast('Anomaly Resolved', `Incident ${anomId} marked resolved. Pipe ${pId} returned to Normal Operations.`, 'success');
        setResolveModalData(null);
      };

      // Smart Dispatch Simulation Trigger
      const runSmartDispatchSimulation = () => {
        let dispatchedCount = 0;
        setAnomalies(prev => prev.map(a => {
          if (a.status === 'ACTIVE' && a.severity === 'CRITICAL') {
            dispatchedCount++;
            return {
              ...a,
              status: 'DISPATCHED',
              assignedTeam: a.category === 'CRITICAL_BURST' ? 'Rapid Rupture Repair Crew Alpha' : 'Sanitation Hazmat Squad'
            };
          }
          return a;
        }));

        setWorkOrders(prev => prev.map(w => {
          if (w.status === 'OPEN' && (w.priority === 'CRITICAL' || w.priority === 'HIGH')) {
            return {
              ...w,
              status: 'ASSIGNED',
              assignedTechnician: w.assignedTeam.includes('Rupture') ? 'Sr. Foreman R. Verma (En Route)' : 'Tech Specialist Auto-Assigned',
              resolutionNotes: 'Dispatched via AI Multi-Criteria Optimization Rule Engine.'
            };
          }
          return w;
        }));

        addToast('AI Smart Dispatch Completed', `Rule-based dispatch optimized ${dispatchedCount} emergency response crews.`, 'success');
      };

      // Export CSV
      const handleExportCSV = () => {
        const headers = ["Anomaly ID", "Pipe ID", "Zone", "Category", "Severity", "Expected Pressure (bar)", "Actual Pressure (bar)", "Delta P (bar)", "z-Score", "Est Water Loss (m3/h)", "AI Confidence (%)", "Status"];
        const rows = anomalies.map(a => [
          a.id, a.pipeId, a.zone, a.category, a.severity, a.expectedPressure, a.actualPressure, a.deltaP, a.zScore, a.estimatedWaterLoss, a.confidenceScore, a.status
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `PipeGraph_Telemetry_Report_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        addToast('CSV Exported', 'Telemetry & anomaly records downloaded successfully.', 'success');
      };

      // Reset mock data to initial
      const handleResetData = () => {
        setNodes(RAW_NODES);
        setPipes(RAW_PIPES);
        setAnomalies(RAW_ANOMALIES);
        setWorkOrders(RAW_WORK_ORDERS);
        setContaminationPaths(RAW_CONTAMINATION_PATHS);
        localStorage.removeItem('pipegraph_nodes');
        localStorage.removeItem('pipegraph_pipes');
        localStorage.removeItem('pipegraph_anomalies');
        localStorage.removeItem('pipegraph_workorders');
        addToast('Data Reset', 'All network parameters reset to baseline demo dataset.', 'info');
      };

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-brand-darkest text-slate-100 font-sans">
          {/* TOAST CONTAINER */}
          <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm">
            {toasts.map(t => (
              <div key={t.id} className="bg-brand-surface border border-brand-cyan/40 p-3 rounded-lg shadow-xl shadow-cyan-950/40 flex items-start gap-3 transform transition-all duration-300">
                <div className={`mt-0.5 ${t.type === 'success' ? 'text-emerald-400' : t.type === 'error' ? 'text-red-400' : 'text-brand-cyan'}`}>
                  <Icon name={t.type === 'success' ? 'checkCircle' : t.type === 'error' ? 'xCircle' : 'info'} className="w-5 h-5" />
                </div>
                <div className="flex-1">
                  <div className="text-xs font-bold text-white uppercase tracking-wider">{t.title}</div>
                  <div className="text-xs text-slate-300 mt-0.5">{t.message}</div>
                </div>
              </div>
            ))}
          </div>

          {/* LEFT NAVIGATION SIDEBAR */}
          <aside className={`${sidebarCollapsed ? 'w-20' : 'w-64'} transition-all duration-300 flex flex-col border-r border-brand-border bg-brand-dark z-30 select-none`}>
            {/* Logo & Brand Header */}
            <div className="h-16 flex items-center justify-between px-4 border-b border-brand-border/60">
              <div className="flex items-center gap-3 overflow-hidden cursor-pointer" onClick={() => setActiveTab('overview')}>
                <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-cyan to-brand-blue flex items-center justify-center text-brand-darkest font-extrabold shadow-lg shadow-cyan-500/20">
                  <Icon name="activity" className="w-5 h-5 text-brand-darkest stroke-[2.5]" />
                </div>
                {!sidebarCollapsed && (
                  <div>
                    <div className="font-extrabold text-base tracking-wider text-white flex items-center gap-1.5">
                      PipeGraph
                      <span className="text-[10px] bg-brand-cyan/20 text-brand-cyan px-1.5 py-0.2 rounded border border-brand-cyan/30">AI</span>
                    </div>
                    <div className="text-[10px] text-slate-400 font-mono tracking-tight uppercase">Digital Twin OS</div>
                  </div>
                )}
              </div>
              <button 
                onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                className="text-slate-400 hover:text-white p-1 rounded hover:bg-brand-surfaceLight transition"
                title={sidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}
              >
                <Icon name="chevronRight" className={`w-4 h-4 transform transition-transform ${sidebarCollapsed ? '' : 'rotate-180'}`} />
              </button>
            </div>

            {/* Navigation Menu Items */}
            <nav className="flex-1 overflow-y-auto py-4 px-2 space-y-1">
              {[
                { id: 'overview', label: 'Overview', icon: 'activity', badge: null },
                { id: 'map', label: 'Digital Twin Map', icon: 'map', badge: 'Live' },
                { id: 'health', label: 'Network Health', icon: 'shield', badge: `${kpis.healthScore}%` },
                { id: 'anomalies', label: 'Anomaly Detection', icon: 'shieldAlert', badge: kpis.activeAnomalies, badgeColor: 'bg-red-500/20 text-red-400' },
                { id: 'contamination', label: 'Contamination Risks', icon: 'droplets', badge: contaminationPaths.length, badgeColor: 'bg-purple-500/20 text-purple-400' },
                { id: 'workorders', label: 'Work Orders', icon: 'wrench', badge: workOrders.filter(w => w.status !== 'RESOLVED').length },
                { id: 'analytics', label: 'Analytics & Reports', icon: 'barChart', badge: null },
                { id: 'settings', label: 'Settings & Calib.', icon: 'settings', badge: null },
              ].map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium transition-all ${
                      isActive 
                        ? 'bg-brand-cyan/15 text-brand-cyan border border-brand-cyan/30 shadow-sm shadow-cyan-900/30' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-brand-surface/60'
                    }`}
                  >
                    <Icon name={item.icon} className={`w-4 h-4 shrink-0 ${isActive ? 'text-brand-cyan' : 'text-slate-400'}`} />
                    {!sidebarCollapsed && (
                      <span className="flex-1 text-left truncate">{item.label}</span>
                    )}
                    {!sidebarCollapsed && item.badge && (
                      <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-mono font-bold ${item.badgeColor || 'bg-brand-surfaceLight text-slate-300'}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>

            {/* Sidebar Bottom: Connected status & User */}
            <div className="p-3 border-t border-brand-border/60 bg-brand-surface/40">
              <div className="flex items-center gap-2 mb-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                {!sidebarCollapsed && (
                  <div className="text-[11px] font-mono text-emerald-400">Twin Synced (Physics PINN)</div>
                )}
              </div>
              <div className="flex items-center gap-2.5 pt-2 border-t border-brand-border/30">
                <div className="w-7 h-7 rounded-full bg-brand-surfaceLight border border-brand-border flex items-center justify-center text-slate-300">
                  <Icon name="user" className="w-3.5 h-3.5" />
                </div>
                {!sidebarCollapsed && (
                  <div className="overflow-hidden">
                    <div className="text-xs font-semibold text-white truncate">Er. S. Ramanujan</div>
                    <div className="text-[10px] text-slate-400 truncate">Chief Hydraulic Engineer</div>
                  </div>
                )}
              </div>
            </div>
          </aside>

          {/* MAIN WORKSPACE WRAPPER */}
          <div className="flex-1 flex flex-col overflow-hidden">
            {/* TOP HEADER */}
            <header className="h-16 border-b border-brand-border bg-brand-dark/95 backdrop-blur px-6 flex items-center justify-between z-20">
              {/* Breadcrumbs & Title */}
              <div className="flex items-center gap-3">
                <span className="text-xs font-mono text-slate-400">ZONE:</span>
                <select
                  value={selectedZone}
                  onChange={(e) => setSelectedZone(e.target.value)}
                  className="bg-brand-surface text-slate-200 border border-brand-border rounded-lg text-xs px-2.5 py-1.5 focus:outline-none focus:border-brand-cyan"
                >
                  {ZONES_LIST.map(z => (
                    <option key={z.id} value={z.id}>{z.name}</option>
                  ))}
                </select>

                <div className="h-4 w-px bg-brand-border"></div>

                {/* Time Range */}
                <div className="flex items-center bg-brand-surface border border-brand-border rounded-lg p-0.5 text-xs">
                  {['1h', '6h', '24h', '7d'].map(t => (
                    <button
                      key={t}
                      onClick={() => setTimeRange(t)}
                      className={`px-2 py-1 rounded text-[11px] font-medium transition ${timeRange === t ? 'bg-brand-cyan text-brand-darkest font-bold' : 'text-slate-400 hover:text-white'}`}
                    >
                      {t}
                    </button>
                  ))}
                </div>

                {/* DEMO DATA BADGE */}
                <div className="hidden lg:flex items-center gap-1.5 px-2 py-1 rounded bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[11px] font-mono">
                  <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                  DEMO DATA / SIMULATION ACTIVE
                </div>
              </div>

              {/* Right Controls */}
              <div className="flex items-center gap-3">
                {/* Search */}
                <div className="relative hidden md:block">
                  <Icon name="search" className="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Search pipe ID, junction, street..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-56 bg-brand-surface border border-brand-border rounded-lg text-xs pl-8 pr-3 py-1.5 text-slate-200 focus:outline-none focus:border-brand-cyan placeholder-slate-500"
                  />
                </div>

                {/* Simulation Action Buttons */}
                <button
                  onClick={() => setShowInjectModal(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-brand-surfaceLight hover:bg-brand-border border border-brand-border text-brand-cyan text-xs font-medium rounded-lg transition"
                  title="Simulate a new pipe burst or micro-leak"
                >
                  <Icon name="zap" className="w-3.5 h-3.5 text-brand-cyan" />
                  <span>Inject Anomaly</span>
                </button>

                <button
                  onClick={runSmartDispatchSimulation}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-gradient-to-r from-brand-cyan to-brand-blue text-brand-darkest text-xs font-bold rounded-lg shadow-sm hover:brightness-110 transition"
                  title="Simulate rule-based emergency team allocation"
                >
                  <Icon name="wrench" className="w-3.5 h-3.5 text-brand-darkest" />
                  <span>AI Dispatch</span>
                </button>

                {/* Notifications Bell */}
                <div className="relative cursor-pointer" onClick={() => setActiveTab('anomalies')}>
                  <div className="w-8 h-8 rounded-lg bg-brand-surface border border-brand-border flex items-center justify-center text-slate-300 hover:text-white transition">

            <ResolveAnomalyDialog
              anomaly={resolveModalData}
              onClose={() => setResolveModalData(null)}
              onConfirm={confirmResolveAnomaly}
            />
          )}

          {/* PRINT / EXECUTIVE BRIEFING MODAL */}
          {printPreviewMode && (
            <ExecutiveReportModal
              kpis={kpis}
              anomalies={anomalies}
              pipes={pipes}
              workOrders={workOrders}
              onClose={() => setPrintPreviewMode(false)}
            />
          )}
        </div>
      );
    }

    // --- SUB-COMPONENT: DIGITAL TWIN SVG MAP ENGINE ---
    function DigitalTwinSVGMap({
      nodes,
      pipes,
      selectedZone,
      selectedPipeId,
      onSelectPipe,
      layerWater,
      layerSewer,
      layerFlowArrows,
      layerPressureHeatmap,
      lineage
    }) {
      const [pan, setPan] = useState({ x: 20, y: 10 });
      const [zoom, setZoom] = useState(1);
      const isDragging = useRef(false);
      const dragStart = useRef({ x: 0, y: 0 });

      // Filtered nodes and pipes
      const visiblePipes = useMemo(() => {
        return pipes.filter(p => {
          if (p.isSanitation && !layerSewer) return false;
          if (!p.isSanitation && !layerWater) return false;
          if (selectedZone !== 'ALL' && p.zone !== selectedZone) return false;
          return true;
        });
      }, [pipes, layerWater, layerSewer, selectedZone]);

      const visibleNodes = useMemo(() => {
        return nodes.filter(n => {
          if (n.isSewage && !layerSewer) return false;
          if (!n.isSewage && !layerWater) return false;
          if (selectedZone !== 'ALL' && n.zone !== selectedZone) return false;
          return true;
        });
      }, [nodes, layerWater, layerSewer, selectedZone]);

      // Node lookup map
      const nodeMap = useMemo(() => {
        const m = {};
        nodes.forEach(n => { m[n.id] = n; });
        return m;
      }, [nodes]);

      // Drag Handlers
      const handleMouseDown = (e) => {
        isDragging.current = true;
        dragStart.current = { x: e.clientX - pan.x, y: e.clientY - pan.y };
      };

      const handleMouseMove = (e) => {
        if (!isDragging.current) return;
        setPan({
          x: e.clientX - dragStart.current.x,
          y: e.clientY - dragStart.current.y
        });
      };

      const handleMouseUp = () => {
        isDragging.current = false;
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        setZoom(z => Math.min(2.5, Math.max(0.5, z * factor)));
      };

      return (
        <div 
          className="w-full h-full cursor-grab active:cursor-grabbing select-none relative"
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onWheel={handleWheel}
        >
          {/* Zoom and Reset Controls Overlay */}
          <div className="absolute top-4 right-4 z-10 flex flex-col gap-1.5 bg-brand-surface/90 border border-brand-border p-1.5 rounded-lg shadow-lg">
            <button
              onClick={() => setZoom(z => Math.min(2.5, z + 0.15))}
              className="p-1.5 rounded hover:bg-brand-surfaceLight text-slate-300 hover:text-white"
              title="Zoom In"
            >
              <Icon name="zoomIn" className="w-4 h-4" />
            </button>
            <button
              onClick={() => setZoom(z => Math.max(0.5, z - 0.15))}
              className="p-1.5 rounded hover:bg-brand-surfaceLight text-slate-300 hover:text-white"
              title="Zoom Out"
            >
              <Icon name="zoomOut" className="w-4 h-4" />
            </button>
            <button
              onClick={() => { setPan({ x: 20, y: 10 }); setZoom(1); }}
              className="p-1.5 rounded hover:bg-brand-surfaceLight text-slate-300 hover:text-white"
              title="Reset View"
            >
              <Icon name="maximize" className="w-4 h-4" />
            </button>
          </div>

          {/* SVG Canvas */}
          <svg className="w-full h-full">
            <defs>
              {/* Arrow markers for flow vectors */}
              <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#20D9F3" />
              </marker>
              <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10B981" />
              </marker>
              <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F59E0B" />
              </marker>
              <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#EF4444" />
              </marker>
              <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#A855F7" />
              </marker>
              {/* Radial glow filter for bursts */}
              <filter id="glow-burst" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            {/* Transform Group */}
            <g transform={`translate(${pan.x}, ${pan.y}) scale(${zoom})`}>
              {/* District Boundary Outlines */}
              <rect x="100" y="40" width="440" height="200" rx="16" fill="rgba(67, 139, 255, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="115" y="60" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 1: NORTH RIDGE RESIDENTIAL</text>

              <rect x="100" y="220" width="500" height="150" rx="16" fill="rgba(32, 217, 243, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="115" y="240" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 2: CENTRAL COMMERCIAL CORE</text>

              <rect x="280" y="360" width="300" height="190" rx="16" fill="rgba(67, 139, 255, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="295" y="380" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 3: CYBERCITY TECH PARK</text>

              <rect x="580" y="170" width="320" height="190" rx="16" fill="rgba(67, 139, 255, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="595" y="190" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 4: INDUSTRIAL EAST CORRIDOR</text>

              <rect x="560" y="360" width="340" height="190" rx="16" fill="rgba(168, 85, 247, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="575" y="380" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 5: SOUTH SANITATION BASIN</text>

              {/* PRESSURE HEATMAP CONTOUR GLOW (When active) */}
              {layerPressureHeatmap && visibleNodes.map(node => {
                const isLowP = node.actualPressure < 2.0;
                const isHighP = node.actualPressure > 5.0;
                const glowColor = isLowP ? 'rgba(239, 68, 68, 0.25)' : isHighP ? 'rgba(67, 139, 255, 0.25)' : 'rgba(16, 185, 129, 0.15)';
                return (
                  <circle
                    key={`contour-${node.id}`}
                    cx={node.x}
                    cy={node.y}
                    r={node.actualPressure * 14}
                    fill={glowColor}
                    filter="blur(16px)"
                  />
                );
              })}

              {/* PIPES (EDGES) */}
              {visiblePipes.map(pipe => {
                const u = nodeMap[pipe.fromNodeId];
                const v = nodeMap[pipe.toNodeId];
                if (!u || !v) return null;

                const isSelected = pipe.id === selectedPipeId;
                const isUpstream = lineage.upstreamPipes.includes(pipe.id);
                const isDownstream = lineage.downstreamPipes.includes(pipe.id);

                // Pipe styling based on status & layer
                let strokeColor = '#10B981'; // normal
                let strokeWidth = Math.max(3, Math.min(8, pipe.diameter / 120));
                let animClass = 'flow-line-normal';
                let markerId = 'arrow-green';

                if (pipe.isSanitation) {
                  strokeColor = '#A855F7';
                  markerId = 'arrow-purple';
                  strokeWidth = 4.5;
                } else if (pipe.status === 'CRITICAL_BURST') {
                  strokeColor = '#EF4444';
                  markerId = 'arrow-red';
                  strokeWidth = 6.5;
                  animClass = 'flow-line-fast';
                } else if (pipe.status === 'MICRO_LEAK') {
                  strokeColor = '#F59E0B';
                  markerId = 'arrow-amber';
                  strokeWidth = 4.5;
                } else if (pipe.status === 'CONTAMINATION_BLOCKAGE') {
                  strokeColor = '#D946EF';
                  markerId = 'arrow-purple';
                  strokeWidth = 5;
                  animClass = 'flow-line-slow';
                }

                // Lineage highlights override
                if (isSelected) {
                  strokeColor = '#20D9F3';
                  strokeWidth = 7;
                  markerId = 'arrow-cyan';
                } else if (isUpstream) {
                  strokeColor = '#38BDF8'; // glowing cyan upstream
                  strokeWidth = 5.5;
                } else if (isDownstream) {
                  strokeColor = '#60A5FA'; // tech blue downstream
                  strokeWidth = 5.5;
                }

                return (
                  <g key={pipe.id} className="cursor-pointer" onClick={() => onSelectPipe(pipe.id)}>
                    {/* Wider hit zone for easy clicking */}
                    <line
                      x1={u.x}
                      y1={u.y}
                      x2={v.x}
                      y2={v.y}
                      stroke="transparent"
                      strokeWidth={strokeWidth + 14}
                    />

                    {/* Pipe background track */}
                    <line
                      x1={u.x}
                      y1={u.y}
                      x2={v.x}
                      y2={v.y}
                      stroke="#0D1422"
                      strokeWidth={strokeWidth + 2}
                      strokeLinecap="round"
                    />

                    {/* Main Pipe Color Line */}
                    <line
                      x1={u.x}
                      y1={u.y}
                      x2={v.x}
                      y2={v.y}
                      stroke={strokeColor}
                      strokeWidth={strokeWidth}
                      strokeLinecap="round"
                      strokeOpacity={isSelected ? 1 : 0.85}
                    />

                    {/* Directional Flow Animation Line */}
                    {layerFlowArrows && (
                      <line
                        x1={u.x}
                        y1={u.y}
                        x2={v.x}
                        y2={v.y}
                        stroke={isSelected ? '#FFFFFF' : strokeColor}
                        strokeWidth={strokeWidth * 0.5}
                        className={animClass}
                        strokeOpacity={0.9}
                        markerEnd={`url(#${markerId})`}
                      />
                    )}

                    {/* Pipe ID Badge on mid-point */}
                    <g transform={`translate(${(u.x + v.x) / 2}, ${(u.y + v.y) / 2})`}>
                      <rect
                        x="-18"
                        y="-9"
                        width="36"
                        height="18"
                        rx="4"
                        fill="#080D18"
                        stroke={isSelected ? '#20D9F3' : '#1E2F48'}
                        strokeWidth="1"
                      />
                      <text
                        x="0"
                        y="3"
                        textAnchor="middle"
                        fill={isSelected ? '#20D9F3' : '#94A3B8'}
                        fontSize="9"
                        fontFamily="JetBrains Mono"
                        fontWeight="600"
                      >
                        {pipe.id}
                      </text>
                    </g>
                  </g>
                );
              })}

              {/* JUNCTIONS & FACILITY NODES */}
              {visibleNodes.map(node => {
                const isSelectedNode = node.id === lineage.upstreamNodes[0] || node.id === lineage.downstreamNodes[0];

                // Node type styling
                let nodeFill = '#111B2B';
                let nodeStroke = '#20D9F3';
                let nodeRadius = 8;
                let symbolIcon = null;

                if (node.type === 'RESERVOIR_WTP') {
                  nodeFill = '#0284C7';
                  nodeStroke = '#38BDF8';
                  nodeRadius = 13;
                } else if (node.type === 'PUMPING_STATION') {
                  nodeFill = '#2563EB';
                  nodeStroke = '#60A5FA';
                  nodeRadius = 11;
                } else if (node.type === 'STORAGE_TANK') {
                  nodeFill = '#0D9488';
                  nodeStroke = '#2DD4BF';
                  nodeRadius = 10;
                } else if (node.type === 'WASTEWATER_SUMP' || node.type === 'SEWER_CHAMBER') {
                  nodeFill = '#7C3AED';
                  nodeStroke = '#C084FC';
                  nodeRadius = 9;
                }

                // Anomaly pulses
                let pulseEffect = null;
                if (node.status === 'CRITICAL_BURST') {
                  pulseEffect = (
                    <circle cx={node.x} cy={node.y} r="18" fill="rgba(239, 68, 68, 0.4)" stroke="#EF4444" className="anim-burst" />
                  );
                } else if (node.status === 'MICRO_LEAK') {
                  pulseEffect = (
                    <circle cx={node.x} cy={node.y} r="14" fill="rgba(245, 158, 11, 0.3)" stroke="#F59E0B" className="anim-leak" />
                  );
                } else if (node.status === 'CONTAMINATION_BLOCKAGE') {
                  pulseEffect = (
                    <circle cx={node.x} cy={node.y} r="16" fill="rgba(168, 85, 247, 0.35)" stroke="#A855F7" className="anim-contamination" />
                  );
                }

                return (
                  <g key={node.id} transform={`translate(0, 0)`} className="cursor-pointer">
                    {pulseEffect}

                    {/* Outer glow ring for selected lineage */}
                    {isSelectedNode && (
                      <circle cx={node.x} cy={node.y} r={nodeRadius + 6} fill="none" stroke="#20D9F3" strokeWidth="2" strokeDasharray="3 3" />
                    )}

                    {/* Main Node Circle */}
                    <circle
                      cx={node.x}
                      cy={node.y}
                      r={nodeRadius}
                      fill={nodeFill}
                      stroke={nodeStroke}
                      strokeWidth={isSelectedNode ? 3 : 2}
                    />

                    {/* Node Label Text */}
                    <text
                      x={node.x}
                      y={node.y + nodeRadius + 13}
                      textAnchor="middle"
                      fill="#CBD5E1"
                      fontSize="10"
                      fontFamily="Inter"
                      fontWeight="500"
                    >
                      {node.name.split(' ')[0]} {node.name.split(' ')[1] || ''}
                    </text>

                    {/* Pressure readout pill under label */}
                    <rect
                      x={node.x - 22}
                      y={node.y + nodeRadius + 18}
                      width="44"
                      height="14"
                      rx="3"
                      fill="#080D18"
                      stroke={node.actualPressure < 2.0 ? '#EF4444' : '#1E2F48'}
                      strokeWidth="1"
                    />
                    <text
                      x={node.x}
                      y={node.y + nodeRadius + 28}
                      textAnchor="middle"
                      fill={node.actualPressure < 2.0 ? '#EF4444' : '#38BDF8'}
                      fontSize="9"
                      fontFamily="JetBrains Mono"
                      fontWeight="600"
                    >
                      {node.actualPressure.toFixed(2)} bar
                    </text>
                  </g>
                );
              })}
            </g>
          </svg>
        </div>
      );
    }

    // --- SUB-COMPONENT: PIPE DETAIL DRAWER (RIGHT INSPECTOR) ---
    function PipeDetailDrawer({
      pipe,
      onClose,
      onCreateWorkOrder,
      onAcknowledge,
      linkedAnomaly,
      simulatedPressureSlider,
      onSliderChange,
      mathAnalysis

      const statusInfo = getStatusStyle(pipe.status);

      return (
        <div className="space-y-4 text-xs font-sans">
          {/* Header */}
          <div className="flex items-center justify-between pb-3 border-b border-brand-border">
            <div>
              <div className="flex items-center gap-2">
                <span className="font-mono font-extrabold text-white text-base">{pipe.id}</span>
                <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${statusInfo.bg} ${statusInfo.text} ${statusInfo.border}`}>
                  {statusInfo.label}
                </span>
              </div>
              <div className="text-[11px] text-slate-400 mt-0.5 truncate max-w-[240px]">{pipe.name}</div>
            </div>
            <button onClick={onClose} className="text-slate-400 hover:text-white p-1 rounded hover:bg-brand-surfaceLight">
              <Icon name="xCircle" className="w-4 h-4" />
            </button>
          </div>

          {/* Telemetry Source Tag */}
          <div className="p-2.5 rounded-lg bg-brand-surface border border-brand-border flex items-center justify-between">
            <span className="text-[11px] text-slate-400">Data Source:</span>
            <span className="font-mono text-[10px] font-bold text-brand-cyan flex items-center gap-1">
              <Icon name="radio" className="w-3 h-3" />
              {pipe.telemetrySource === 'PHYSICS_PINN_MODEL' ? 'Graph PINN Digital Twin (Pure Software)' : 'Transducer Telemetry'}
            </span>
          </div>

          {/* Hydraulic Telemetry Grid */}
          <div className="bg-brand-surface rounded-xl border border-brand-border p-3 space-y-2.5">
            <div className="text-[10px] uppercase font-mono font-bold text-slate-400 tracking-wider">Hydraulic Telemetry</div>
            
            <div className="grid grid-cols-2 gap-2 text-[11px]">
              <div className="bg-brand-dark p-2 rounded border border-brand-border/60">
                <span className="text-slate-400 text-[10px] block">Expected Pressure:</span>
                <span className="font-mono font-bold text-white text-sm">{pipe.expectedPressureDownstream.toFixed(2)} bar</span>
              </div>
              <div className="bg-brand-dark p-2 rounded border border-brand-border/60">
                <span className="text-slate-400 text-[10px] block">Actual / Modeled P:</span>
                <span className={`font-mono font-bold text-sm ${mathAnalysis ? (mathAnalysis.deltaP < -1.0 ? 'text-red-400' : mathAnalysis.deltaP < -0.2 ? 'text-amber-400' : 'text-emerald-400') : 'text-white'}`}>
                  {Number(simulatedPressureSlider).toFixed(2)} bar
                </span>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2 text-[11px]">
              <div className="bg-brand-dark p-1.5 rounded border border-brand-border/60 text-center">
                <span className="text-slate-500 text-[9px] block">ΔP Deviation</span>
                <span className="font-mono font-bold text-amber-400">{mathAnalysis ? mathAnalysis.deltaP : (pipe.actualPressureDownstream - pipe.expectedPressureDownstream).toFixed(2)} bar</span>
              </div>
              <div className="bg-brand-dark p-1.5 rounded border border-brand-border/60 text-center">
                <span className="text-slate-500 text-[9px] block">z-Score</span>
                <span className="font-mono font-bold text-brand-cyan">{mathAnalysis ? mathAnalysis.zScore : '-'}σ</span>
              </div>
              <div className="bg-brand-dark p-1.5 rounded border border-brand-border/60 text-center">
                <span className="text-slate-500 text-[9px] block">Est Loss</span>
                <span className="font-mono font-bold text-red-400">{mathAnalysis ? mathAnalysis.leakRate : pipe.leakageRate} m³/h</span>
              </div>

            {/* Live Interactive Pressure Slider */}
            <div className="pt-2 border-t border-brand-border/40">
              <div className="flex items-center justify-between text-[11px] mb-1">
                <span className="text-slate-300 font-medium">Interactive Pressure Injector:</span>

                type="range"
                min="0.0"
                max="6.0"
                step="0.05"

                className="w-full h-1.5 bg-brand-surfaceLight rounded-lg appearance-none cursor-pointer accent-brand-cyan"
              />
              <div className="flex justify-between text-[9px] font-mono text-slate-500 mt-1">
                <span>0.0 (Back-siphon)</span>
                <span>Normal: {pipe.expectedPressureDownstream.toFixed(1)}</span>
                <span>6.0 (High Head)</span>
              </div>
            </div>
          </div>

          {/* Physical Infrastructure Specs */}
          <div className="bg-brand-surface rounded-xl border border-brand-border p-3 space-y-2">
            <div className="text-[10px] uppercase font-mono font-bold text-slate-400 tracking-wider">Asset Specifications</div>
            <div className="space-y-1.5 text-[11px]">
              <div className="flex justify-between text-slate-400">
                <span>Material:</span>
                <span className="font-medium text-slate-200">{pipe.material}</span>
              </div>
              <div className="flex justify-between text-slate-400">
                <span>Diameter:</span>
                <span className="font-medium text-slate-200">{pipe.diameter} mm</span>
              </div>
              <div className="flex justify-between text-slate-400">
                <span>Length:</span>
                <span className="font-medium text-slate-200">{pipe.length} m</span>
              </div>
              <div className="flex justify-between text-slate-400">
                <span>Age / Installed:</span>
                <span className="font-medium text-slate-200">{pipe.ageYears} yrs ({pipe.installYear})</span>
              </div>
              <div className="flex justify-between text-slate-400">
                <span>Roughness (C):</span>
                <span className="font-medium text-slate-200">{pipe.roughness}</span>

                <span>Soil Surround:</span>
                <span className="font-medium text-slate-200">{pipe.soilCondition || 'Sandy Loam'}</span>
              </div>
              <div className="flex justify-between text-slate-400">
                <span>Upstream Node:</span>
                <span className="font-mono text-brand-cyan font-bold">{pipe.fromNodeId}</span>
              </div>
              <div className="flex justify-between text-slate-400">

          {/* AI Diagnostics & Next Action */}

            <div className="bg-brand-surface rounded-xl border border-amber-500/30 p-3 space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-[10px] uppercase font-mono font-bold text-amber-400">AI Confidence Diagnosis</span>
                <span className="text-xs font-mono font-bold text-white bg-amber-500/20 px-2 py-0.5 rounded border border-amber-500/30">
                  {pipe.anomalyConfidence}%
                </span>

              {/* Action Buttons */}
              <div className="pt-2 flex flex-col gap-2">
                <button
                  onClick={onCreateWorkOrder}
                  className="w-full py-2 bg-gradient-to-r from-brand-cyan to-brand-blue text-brand-darkest font-bold rounded-lg text-xs hover:brightness-110 flex items-center justify-center gap-1.5 transition"
                >
                  <Icon name="wrench" className="w-3.5 h-3.5 text-brand-darkest" />
                  <span>Dispatch Emergency Work Order</span>
                </button>
                {linkedAnomaly && linkedAnomaly.status === 'ACTIVE' && (
                  <button
                    onClick={onAcknowledge}
                    className="w-full py-1.5 bg-brand-surfaceLight border border-brand-border hover:border-slate-400 text-slate-300 text-xs rounded-lg transition"
                  >
                    Acknowledge Alert
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- SUB-COMPONENT: MATHEMATICAL PRESSURE ANALYSIS CARD ---
    function MathematicalPressureCard({
      selectedPipe,
      simulatedPressureSlider,
      onSliderChange,
      mathAnalysis,
      settings
    }) {
      if (!selectedPipe || !mathAnalysis) return null;

      return (
        <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-5 shadow-xl space-y-4">

    // --- MODAL: INJECT CUSTOM ANOMALY ---
    function InjectAnomalyModal({ pipes, onClose, onInject }) {
      const [pipeId, setPipeId] = useState(pipes[0]?.id || 'P-101');
      const [category, setCategory] = useState('CRITICAL_BURST');
      const [severity, setSeverity] = useState('CRITICAL');
      const [customDrop, setCustomDrop] = useState(2.2);

      const targetPipe = pipes.find(p => p.id === pipeId) || pipes[0];

      const handleConfirm = () => {
        const expected = targetPipe.expectedPressureDownstream;
        const actual = Math.max(0.1, Number((expected - customDrop).toFixed(2)));
        const deltaP = Number((actual - expected).toFixed(2));
        const zScore = Number((deltaP / (targetPipe.pressureSigma || 0.25)).toFixed(2));
        const lossRate = category === 'CRITICAL_BURST' ? 32.0 : category === 'MICRO_LEAK' ? 5.2 : 4.0;

        const newAnomaly = {
          id: `ANOM-${Date.now().toString().slice(-4)}`,
          pipeId: targetPipe.id,
          nodeId: targetPipe.toNodeId,
          zone: targetPipe.zone,
          category,
          severity,
          expectedPressure: expected,
          actualPressure: actual,
          deltaP,
          zScore,
          estimatedWaterLoss: lossRate,
          confidenceScore: 96.5,
          detectedAt: 'Just now (Simulated)',
          status: 'ACTIVE',
          description: `Simulated ${category} on ${targetPipe.diameter}mm ${targetPipe.material} segment ${targetPipe.id}.`,
          recommendedAction: 'Immediate field dispatch for acoustic correlation and isolation valve throttle.',
          assignedTeam: 'Unassigned'
        };

        const updatedPipe = {
          ...targetPipe,
          status: category,
          actualPressureDownstream: actual,
          leakageRate: lossRate,
          anomalyConfidence: 96.5,
          recommendedAction: newAnomaly.recommendedAction
        };

        onInject(newAnomaly, updatedPipe);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-brand-dark border border-brand-border rounded-xl max-w-md w-full p-5 space-y-4 shadow-2xl">

              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="space-y-3 text-xs">
              <div>
                <label className="text-slate-300 block mb-1 font-medium">Select Target Pipe:</label>
                <select
                  value={pipeId}
                  onChange={(e) => setPipeId(e.target.value)}
                  className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white"
                >
                  {pipes.map(p => (
                    <option key={p.id} value={p.id}>{p.id} — {p.name} ({p.diameter}mm)</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-slate-300 block mb-1 font-medium">Anomaly Classification:</label>
                <select
                  value={category}

            <div className="pt-2 flex justify-end gap-2">
              <button onClick={onClose} className="px-3 py-1.5 rounded-lg bg-brand-surface text-slate-300 text-xs">Cancel</button>
              <button onClick={handleSave} className="px-4 py-1.5 rounded-lg bg-brand-cyan text-brand-darkest font-bold text-xs hover:brightness-110">Dispatch Crew</button>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL: RESOLVE ANOMALY CONFIRMATION ---
    function ResolveAnomalyDialog({ anomaly, onClose, onConfirm }) {
      const [notes, setNotes] = useState('Repaired mechanical coupling clamp. Hydrostatic pressure verified stable.');

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-brand-dark border border-brand-border rounded-xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between items-center pb-2 border-b border-brand-border">
              <h3 className="font-bold text-white text-sm flex items-center gap-2">
                <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
                Confirm Incident Remediation
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="text-xs text-slate-300 space-y-2">
              <p>
                Marking anomaly <span className="font-mono font-bold text-white">{anomaly.id}</span> on pipe <span className="font-mono text-brand-cyan font-bold">{anomaly.pipeId}</span> as Resolved.
              </p>
              <div>
                <label className="text-slate-400 block mb-1 font-medium">Remediation Closure Log:</label>
                <textarea
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  rows="3"
                  className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white text-xs"
                />
              </div>
            </div>

            <div className="pt-2 flex justify-end gap-2">
              <button onClick={onClose} className="px-3 py-1.5 rounded-lg bg-brand-surface text-slate-300 text-xs">Cancel</button>
              <button onClick={() => onConfirm(notes)} className="px-4 py-1.5 rounded-lg bg-emerald-500 text-brand-darkest font-bold text-xs hover:brightness-110">Confirm & Close</button>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL: EXECUTIVE BRIEFING PRINT REPORT ---
    function ExecutiveReportModal({ kpis, anomalies, pipes, workOrders, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md overflow-y-auto p-6 flex justify-center">
          <div className="bg-white text-slate-900 rounded-xl max-w-3xl w-full p-8 shadow-2xl relative space-y-6 my-auto font-sans">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-500 hover:text-black font-bold text-lg">✕</button>

            {/* Header */}
            <div className="border-b-2 border-slate-900 pb-4 flex justify-between items-start">
              <div>
                <h1 className="text-2xl font-black tracking-tight text-slate-900">PIPEGRAPH EXECUTIVE TELEMETRY BRIEFING</h1>
                <p className="text-xs text-slate-600 mt-0.5">Municipal Water Distribution & Sanitation Digital Twin Operations Center</p>
              </div>
              <div className="text-right text-xs font-mono">
                <div>Date: {new Date().toLocaleDateString('en-GB')}</div>
                <div className="font-bold text-emerald-700">STATUS: AUDITED</div>
              </div>
            </div>

            {/* Summary Metrics */}
            <div className="grid grid-cols-4 gap-4 p-4 bg-slate-50 rounded-lg border border-slate-200 text-center">
              <div>
                <div className="text-[10px] text-slate-500 uppercase font-bold">Network Length</div>
                <div className="text-lg font-bold text-slate-900">{kpis.totalLengthKm} km</div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 uppercase font-bold">Health Score</div>
                <div className="text-lg font-bold text-emerald-600">{kpis.healthScore}%</div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 uppercase font-bold">Loss Rate</div>
                <div className="text-lg font-bold text-amber-600">{kpis.totalLossRate} m³/h</div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 uppercase font-bold">Daily Cost</div>
                <div className="text-lg font-bold text-slate-900">₹{(kpis.dailyFinancial).toLocaleString('en-IN')}</div>
              </div>
            </div>

            {/* Critical Anomalies Table */}
            <div>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 mb-2">High & Critical Priority Infrastructure Incidents</h3>
              <table className="w-full text-left text-xs border border-slate-200">
                <thead className="bg-slate-100 text-slate-700 font-mono text-[10px] uppercase">
                  <tr>
                    <th className="p-2 border">Anomaly ID</th>
                    <th className="p-2 border">Pipe ID</th>
                    <th className="p-2 border">Category</th>
                    <th className="p-2 border">ΔP (bar)</th>
                    <th className="p-2 border">Loss Rate</th>
                    <th className="p-2 border">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {anomalies.filter(a => a.severity === 'CRITICAL' || a.severity === 'HIGH').map(a => (
                    <tr key={a.id}>
                      <td className="p-2 border font-mono font-bold">{a.id}</td>
                      <td className="p-2 border font-mono">{a.pipeId}</td>
                      <td className="p-2 border">{a.category}</td>
                      <td className="p-2 border font-mono text-red-600">{a.deltaP} bar</td>
                      <td className="p-2 border font-mono">{a.estimatedWaterLoss} m³/h</td>
                      <td className="p-2 border font-semibold">{a.status}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Engineering Recommendation Signature */}
            <div className="pt-6 border-t border-slate-200 flex justify-between items-end text-xs text-slate-600">
              <div>
                <div className="font-semibold text-slate-900">Prepared by: AI Digital Twin Engine (PINN-Graph v2.4)</div>
                <div>Supervised by: Er. S. Ramanujan, Chief Hydraulic Engineer</div>
              </div>
              <button
                onClick={() => window.print()}
                className="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-bold hover:bg-slate-800 transition no-print"
              >
                Print PDF Report
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- INITIALIZE REACT APPLICATION ---
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
