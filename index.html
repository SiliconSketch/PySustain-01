                      <div className="text-[10px] text-slate-300 font-medium">{sensor.name}</div>

                      <div className="grid grid-cols-3 gap-1.5 font-mono text-[10px] pt-1 border-t border-brand-border/40">
                        <div className="bg-brand-surface p-1 rounded text-center">
                          <span className="text-slate-500 text-[8.5px] block">Turbidity</span>
                          <span className={`font-bold ${sensor.parameters.turbidityNtu > 4 ? 'text-red-400' : 'text-slate-200'}`}>
                            {sensor.parameters.turbidityNtu} NTU
                          </span>
                        </div>
                        <div className="bg-brand-surface p-1 rounded text-center">
                          <span className="text-slate-500 text-[8.5px] block">Free Clâ‚‚</span>
                          <span className={`font-bold ${sensor.parameters.freeChlorineMgL < 0.2 ? 'text-red-400' : 'text-emerald-400'}`}>
                            {sensor.parameters.freeChlorineMgL} mg/L
                          </span>
                        </div>
                        <div className="bg-brand-surface p-1 rounded text-center">
                          <span className="text-slate-500 text-[8.5px] block">pH Level</span>
                          <span className="font-bold text-slate-200">{sensor.parameters.phLevel}</span>

                      </div>

                      {(sensor.parameters.eColiCfuPer100ml > 0 || (sensor.parameters.ammoniaPpm && sensor.parameters.ammoniaPpm > 0.5)) && (
                        <div className="p-1.5 rounded bg-red-950/40 border border-red-500/30 text-[9.5px] space-y-0.5">

                            <span>â˜£ Sewage Ingress Alert:</span>
                            <span>E. coli: {sensor.parameters.eColiCfuPer100ml} CFU</span>
                          </div>
                          <div className="text-slate-300">
                            Ammonia: {sensor.parameters.ammoniaPpm} ppm | Hâ‚‚S: {sensor.parameters.h2sLevelPpm} ppm
                          </div>
                        </div>
                      )}

                      {sensor.alertSummary && (
                        <div className="text-[9.5px] text-red-300 italic pt-0.5">
                          {sensor.alertSummary}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* AI Diagnostics & Next Action */}
          {pipe.status !== 'NORMAL' && (
            <div className="bg-brand-surface rounded-xl border border-amber-500/30 p-3 space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-[10px] uppercase font-mono font-bold text-amber-400">AI Confidence Diagnosis</span>
                <span className="text-xs font-mono font-bold text-white bg-amber-500/20 px-2 py-0.5 rounded border border-amber-500/30">
                  {pipe.anomalyConfidence}%
                </span>
              </div>
              <p className="text-[11px] text-slate-300 leading-relaxed">
                {pipe.recommendedAction || mathAnalysis?.explanation}
              </p>

              {/* Action Buttons */}
              <div className="pt-2 flex flex-col gap-2">
                <button
                  onClick={onCreateWorkOrder}
                  className="w-full py-2 bg-gradient-to-r from-brand-cyan to-brand-blue text-brand-darkest font-bold rounded-lg text-xs hover:brightness-110 flex items-center justify-center gap-1.5 transition"
                >
                  <Icon name="wrench" className="w-3.5 h-3.5 text-brand-darkest" />
                  <span>Dispatch Emergency Work Order</span>
                </button>
                {linkedAnomaly && linkedAnomaly.status === 'ACTIVE' && (
                  <button
                    onClick={onAcknowledge}
                    className="w-full py-1.5 bg-brand-surfaceLight border border-brand-border hover:border-slate-400 text-slate-300 text-xs rounded-lg transition"
                  >
                    Acknowledge Alert
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- SUB-COMPONENT: MATHEMATICAL PRESSURE ANALYSIS CARD ---
    function MathematicalPressureCard({
      selectedPipe,
      simulatedPressureSlider,
      onSliderChange,
      mathAnalysis,
      settings
    }) {
      if (!selectedPipe || !mathAnalysis) return null;

      return (
        <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-5 shadow-xl space-y-4">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-2 border-b border-brand-border/40 pb-3">
            <div>
              <div className="flex items-center gap-2">
                <Icon name="sliders" className="w-4 h-4 text-brand-cyan" />
                <h3 className="text-sm font-bold uppercase tracking-wider text-white">
                  Explainable Hydraulic Pressure & AI Physics Formulation
                </h3>
              </div>
              <p className="text-xs text-slate-400 mt-0.5">
                Demonstrating graph-based physical state estimation and anomaly deviation scoring without specialized hardware.
              </p>
            </div>
            <div className="flex items-center gap-2 text-xs font-mono">
              <span className="text-slate-400">Target Node:</span>
              <span className="px-2 py-0.5 rounded bg-brand-cyan/20 text-brand-cyan font-bold">{selectedPipe.toNodeId}</span>
            </div>
          </div>

          {/* Mathematical Formulations Display */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
            {/* Formula 1 */}
            <div className="bg-brand-dark p-3 rounded-lg border border-brand-border">
              <div className="text-[10px] uppercase font-mono text-slate-400 font-bold mb-1">Pressure Deviation</div>
              <div className="font-mono text-brand-cyan text-sm py-1 font-semibold">
                ΔP<sub className="text-[10px]">i</sub> = P<sub className="text-[10px]">i</sub><sup className="text-[10px]">actual</sup> - P<sub className="text-[10px]">i</sub><sup className="text-[10px]">expected</sup>
              </div>
              <div className="text-[11px] text-slate-300 font-mono mt-1">
                = {mathAnalysis.actualP.toFixed(2)} - {mathAnalysis.expectedP.toFixed(2)} = <span className="font-bold text-amber-400">{mathAnalysis.deltaP} bar</span>
              </div>
            </div>

            {/* Formula 2 */}
            <div className="bg-brand-dark p-3 rounded-lg border border-brand-border">
              <div className="text-[10px] uppercase font-mono text-slate-400 font-bold mb-1">Normalized Deviation (z-Score)</div>
              <div className="font-mono text-brand-cyan text-sm py-1 font-semibold">
                z<sub className="text-[10px]">i</sub> = (P<sub className="text-[10px]">i</sub><sup className="text-[10px]">actual</sup> - P<sub className="text-[10px]">i</sub><sup className="text-[10px]">expected</sup>) / σ<sub className="text-[10px]">i</sub>
              </div>
              <div className="text-[11px] text-slate-300 font-mono mt-1">
                = {mathAnalysis.deltaP} / {selectedPipe.pressureSigma || 0.25} = <span className="font-bold text-red-400">{mathAnalysis.zScore}σ</span>
              </div>
            </div>

            {/* Formula 3 */}
            <div className="bg-brand-dark p-3 rounded-lg border border-brand-border">
              <div className="text-[10px] uppercase font-mono text-slate-400 font-bold mb-1">Hydraulic Headloss Balance</div>
              <div className="font-mono text-brand-cyan text-sm py-1 font-semibold">
                P<sub className="text-[10px]">up</sub> - P<sub className="text-[10px]">down</sub> = ρgΔz + h<sub className="text-[10px]">L</sub>
              </div>
              <div className="text-[11px] text-slate-300 font-mono mt-1">
                ρ={settings.fluidDensity} kg/m³, g={settings.gravity} m/s²
              </div>
            </div>
          </div>

          {/* Interactive Simulation Slider Bar */}
          <div className="bg-brand-dark/80 p-4 rounded-xl border border-brand-cyan/30 space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <span className="text-xs font-bold text-white flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-brand-cyan animate-pulse"></span>
                Interactive Pressure Slider (Simulate Pipe Anomaly Live):
              </span>
              <div className="flex items-center gap-3 font-mono text-xs">
                <span className="text-slate-400">Simulated Actual P:</span>
                <span className="text-sm font-bold text-brand-cyan bg-brand-surface px-2.5 py-1 rounded border border-brand-border">
                  {Number(simulatedPressureSlider).toFixed(2)} bar
                </span>
                <span className="text-slate-400">Class:</span>
                <span className={`px-2 py-0.5 rounded font-bold ${getStatusStyle(mathAnalysis.classification).bg} ${getStatusStyle(mathAnalysis.classification).text}`}>
                  {getStatusStyle(mathAnalysis.classification).label}
                </span>
              </div>
            </div>

            <input
              type="range"
              min="0.0"
              max="6.0"
              step="0.05"
              value={simulatedPressureSlider}
              onChange={(e) => onSliderChange(parseFloat(e.target.value))}
              className="w-full h-2 bg-brand-surfaceLight rounded-lg appearance-none cursor-pointer accent-brand-cyan"
            />

            {/* AI Explanation Text */}
            <div className="p-3 rounded-lg bg-brand-surface border border-brand-border/60 text-xs text-slate-200 leading-relaxed flex items-start gap-2.5">
              <Icon name="info" className="w-4 h-4 text-brand-cyan shrink-0 mt-0.5" />
              <div>
                <span className="font-bold text-brand-cyan">Explainable AI Reasoning: </span>
                {mathAnalysis.explanation}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- SUB-COMPONENT: ANOMALY DETECTION VIEW ---
    function AnomalyDetectionView({ anomalies, onAcknowledge, onLocateOnMap, onCreateWorkOrder, onResolvePrompt }) {
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterSeverity, setFilterSeverity] = useState('ALL');

      const filtered = useMemo(() => {
        return anomalies.filter(a => {
          if (filterCategory !== 'ALL' && a.category !== filterCategory) return false;
          if (filterSeverity !== 'ALL' && a.severity !== filterSeverity) return false;
          return true;
        });
      }, [anomalies, filterCategory, filterSeverity]);

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-2 border-b border-brand-border/40">
            <div>
              <h1 className="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                <Icon name="shieldAlert" className="w-6 h-6 text-red-400" />
                AI Anomaly Detection Console
              </h1>
              <p className="text-xs text-slate-400 mt-1">
                Real-time classification, hydraulic deviations, and mitigation actions.
              </p>
            </div>

            {/* Filters */}
            <div className="flex items-center gap-3 text-xs">
              <select
                value={filterCategory}
                onChange={(e) => setFilterCategory(e.target.value)}
                className="bg-brand-surface text-slate-200 border border-brand-border rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-brand-cyan"
              >
                <option value="ALL">All Categories</option>
                <option value="CRITICAL_BURST">Critical Pipe Bursts</option>
                <option value="MICRO_LEAK">Minor Leaks</option>
                <option value="CONTAMINATION_BLOCKAGE">Contamination / Blockages</option>
              </select>

              <select
                value={filterSeverity}
                onChange={(e) => setFilterSeverity(e.target.value)}
                className="bg-brand-surface text-slate-200 border border-brand-border rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-brand-cyan"
              >
                <option value="ALL">All Severities</option>
                <option value="CRITICAL">Critical</option>
                <option value="HIGH">High</option>
                <option value="MEDIUM">Medium</option>
                <option value="LOW">Low</option>
              </select>
            </div>
          </div>

          {/* Anomaly Table */}
          <div className="bg-brand-surface/90 border border-brand-border rounded-xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead>
                  <tr className="bg-brand-dark/90 text-slate-400 border-b border-brand-border font-mono text-[11px] uppercase">
                    <th className="py-3 px-4">Anomaly ID</th>
                    <th className="py-3 px-3">Target Pipe</th>
                    <th className="py-3 px-3">Category</th>
                    <th className="py-3 px-3">Severity</th>
                    <th className="py-3 px-3">Expected vs Actual</th>
                    <th className="py-3 px-3">ΔP / z-Score</th>
                    <th className="py-3 px-3">Loss Rate</th>
                    <th className="py-3 px-3">AI Confidence</th>
                    <th className="py-3 px-3">Status</th>
                    <th className="py-3 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-brand-border/40 font-sans">
                  {filtered.map(anom => {
                    const statusClass = getStatusStyle(anom.category);
                    return (
                      <tr key={anom.id} className="hover:bg-brand-surfaceLight/50 transition">
                        <td className="py-3 px-4 font-mono font-bold text-white">{anom.id}</td>
                        <td className="py-3 px-3 font-mono text-brand-cyan font-semibold">{anom.pipeId}</td>
                        <td className="py-3 px-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${statusClass.bg} ${statusClass.text} ${statusClass.border}`}>
                            {statusClass.label}
                          </span>
                        </td>
                        <td className="py-3 px-3">{getSeverityBadge(anom.severity)}</td>
                        <td className="py-3 px-3 font-mono text-slate-300">
                          {anom.expectedPressure.toFixed(2)} → <span className="font-bold text-white">{anom.actualPressure.toFixed(2)} bar</span>
                        </td>
                        <td className="py-3 px-3 font-mono">
                          <span className={anom.deltaP < 0 ? 'text-amber-400' : 'text-blue-400'}>{anom.deltaP > 0 ? `+${anom.deltaP}` : anom.deltaP} bar</span>
                          <span className="text-slate-500 text-[10px] block">z = {anom.zScore}σ</span>
                        </td>
                        <td className="py-3 px-3 font-mono text-red-400 font-semibold">{anom.estimatedWaterLoss} m³/h</td>
                        <td className="py-3 px-3 font-mono font-bold text-white">{anom.confidenceScore}%</td>
                        <td className="py-3 px-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            anom.status === 'RESOLVED' ? 'bg-emerald-500/20 text-emerald-400' :
                            anom.status === 'DISPATCHED' ? 'bg-blue-500/20 text-blue-400' :
                            anom.status === 'ACKNOWLEDGED' ? 'bg-amber-500/20 text-amber-400' :
                            'bg-red-500/20 text-red-400 animate-pulse'
                          }`}>
                            {anom.status}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-right">
                          <div className="flex items-center justify-end gap-1.5">
                            <button
                              onClick={() => onLocateOnMap(anom.pipeId)}
                              className="px-2 py-1 rounded bg-brand-surfaceLight hover:bg-brand-border text-brand-cyan text-[11px] font-medium"
                              title="Locate on Map"
                            >
                              Map
                            </button>
                            {anom.status === 'ACTIVE' && (
                              <button
                                onClick={() => onAcknowledge(anom.id)}
                                className="px-2 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 text-[11px]"
                              >
                                Ack
                              </button>
                            )}
                            {anom.status !== 'RESOLVED' && (
                              <button
                                onClick={() => onResolvePrompt(anom)}
                                className="px-2 py-1 rounded bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 text-[11px]"
                              >
                                Resolve
                              </button>
                            )}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- SUB-COMPONENT: WORK ORDERS VIEW ---
    function WorkOrdersView({ workOrders, onUpdateStatus, onCreateNew, onRunDispatch }) {
      const [viewMode, setViewMode] = useState('KANBAN'); // KANBAN or LIST

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-2 border-b border-brand-border/40">
            <div>
              <h1 className="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                <Icon name="wrench" className="w-6 h-6 text-brand-cyan" />
                Emergency Work Order Management
              </h1>
              <p className="text-xs text-slate-400 mt-1">
                Dispatch field technicians, monitor remediation SLA, and track closure logs.
              </p>
            </div>

            <div className="flex items-center gap-2">
              <div className="flex items-center bg-brand-surface border border-brand-border rounded-lg p-0.5 text-xs">
                <button
                  onClick={() => setViewMode('KANBAN')}
                  className={`px-3 py-1 rounded text-[11px] font-medium ${viewMode === 'KANBAN' ? 'bg-brand-cyan text-brand-darkest font-bold' : 'text-slate-400'}`}
                >
                  Kanban Board
                </button>
                <button
                  onClick={() => setViewMode('LIST')}
                  className={`px-3 py-1 rounded text-[11px] font-medium ${viewMode === 'LIST' ? 'bg-brand-cyan text-brand-darkest font-bold' : 'text-slate-400'}`}
                >
                  List View
                </button>
              </div>

              <button
                onClick={onRunDispatch}
                className="px-3 py-1.5 rounded-lg bg-gradient-to-r from-brand-cyan to-brand-blue text-brand-darkest text-xs font-bold shadow hover:brightness-110 flex items-center gap-1.5 transition"
              >
                <Icon name="zap" className="w-3.5 h-3.5 text-brand-darkest" />
                <span>Simulate AI Smart Dispatch</span>
              </button>

              <button
                onClick={onCreateNew}
                className="px-3 py-1.5 rounded-lg bg-brand-surface border border-brand-border hover:border-brand-cyan text-white text-xs font-medium transition"
              >
                + New Work Order
              </button>
            </div>
          </div>

          {/* KANBAN BOARD VIEW */}
          {viewMode === 'KANBAN' ? (
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              {['OPEN', 'ASSIGNED', 'IN_PROGRESS', 'RESOLVED'].map(colStatus => {
                const colOrders = workOrders.filter(w => w.status === colStatus);
                const colTitle = colStatus === 'IN_PROGRESS' ? 'In Progress' : colStatus;
                return (
                  <div key={colStatus} className="bg-brand-surface/70 border border-brand-border rounded-xl p-3 flex flex-col min-h-[500px]">
                    <div className="flex items-center justify-between pb-2 mb-3 border-b border-brand-border/60">
                      <span className="text-xs font-mono font-bold text-slate-300 uppercase tracking-wider">{colTitle}</span>
                      <span className="text-xs font-mono font-bold px-2 py-0.5 rounded-full bg-brand-dark text-slate-400">
                        {colOrders.length}
                      </span>
                    </div>

                    <div className="space-y-3 flex-1 overflow-y-auto">
                      {colOrders.map(wo => (
                        <div key={wo.id} className="bg-brand-dark border border-brand-border rounded-lg p-3 space-y-2 shadow-sm hover:border-slate-500 transition">
                          <div className="flex items-center justify-between">
                            <span className="font-mono font-bold text-white text-xs">{wo.id}</span>
                            {getSeverityBadge(wo.priority)}
                          </div>
                          <div className="text-xs text-slate-300 font-medium">{wo.issueDescription}</div>
                          <div className="text-[11px] text-brand-cyan font-mono">Pipe: {wo.pipeId}</div>
                          <div className="text-[10px] text-slate-400 flex items-center gap-1">
                            <Icon name="user" className="w-3 h-3" />
                            <span>{wo.assignedTechnician || 'Unassigned'}</span>
                          </div>
                          <div className="text-[10px] text-amber-400 font-mono">{wo.targetResponseTime}</div>

                          {/* Quick Action buttons */}
                          <div className="pt-2 border-t border-brand-border/40 flex justify-between gap-1 text-[10px]">
                            {colStatus === 'OPEN' && (
                              <button onClick={() => onUpdateStatus(wo.id, 'ASSIGNED')} className="px-2 py-1 rounded bg-brand-surfaceLight text-brand-cyan">Assign</button>
                            )}
                            {colStatus === 'ASSIGNED' && (
                              <button onClick={() => onUpdateStatus(wo.id, 'IN_PROGRESS')} className="px-2 py-1 rounded bg-brand-surfaceLight text-brand-cyan">Start Work</button>
                            )}
                            {colStatus === 'IN_PROGRESS' && (
                              <button onClick={() => onUpdateStatus(wo.id, 'RESOLVED')} className="px-2 py-1 rounded bg-emerald-500/20 text-emerald-400">Resolve</button>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            /* LIST VIEW */
            <div className="bg-brand-surface/90 border border-brand-border rounded-xl overflow-hidden shadow-xl">
              <table className="w-full text-left text-xs">
                <thead className="bg-brand-dark text-slate-400 font-mono uppercase text-[11px] border-b border-brand-border">
                  <tr>
                    <th className="py-3 px-4">WO ID</th>
                    <th className="py-3 px-3">Pipe ID</th>
                    <th className="py-3 px-3">Priority</th>
                    <th className="py-3 px-3">Issue Description</th>
                    <th className="py-3 px-3">Assigned Technician</th>
                    <th className="py-3 px-3">SLA Target</th>
                    <th className="py-3 px-3">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-brand-border/40">
                  {workOrders.map(w => (
                    <tr key={w.id} className="hover:bg-brand-surfaceLight/50">
                      <td className="py-3 px-4 font-mono font-bold text-white">{w.id}</td>
                      <td className="py-3 px-3 font-mono text-brand-cyan">{w.pipeId}</td>
                      <td className="py-3 px-3">{getSeverityBadge(w.priority)}</td>
                      <td className="py-3 px-3 text-slate-300 max-w-xs">{w.issueDescription}</td>
                      <td className="py-3 px-3 text-slate-300">{w.assignedTechnician}</td>
                      <td className="py-3 px-3 font-mono text-amber-400">{w.targetResponseTime}</td>
                      <td className="py-3 px-3 font-bold text-slate-300">{w.status}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // --- SUB-COMPONENT: CONTAMINATION RISKS VIEW ---
    function ContaminationRisksView({ contaminationPaths, pipes, nodes, onLocateOnMap, onInitiateContainment }) {
      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-2 border-b border-brand-border/40">
            <div>
              <h1 className="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                <Icon name="droplets" className="w-6 h-6 text-purple-400" />
                Sanitation Network Contamination & Blockage Risks
              </h1>
              <p className="text-xs text-slate-400 mt-1">
                Multi-utility digital twin correlation: wastewater ingestion, negative pressure back-siphonage, and drainage surcharge.
              </p>
            </div>
            <div className="px-3 py-1.5 rounded-lg bg-purple-500/15 border border-purple-500/30 text-purple-300 text-xs font-mono font-bold">
              {contaminationPaths.length} Propagation Pathways Detected
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {contaminationPaths.map(path => (
              <div key={path.id} className="bg-brand-surface/90 border border-purple-500/40 rounded-xl p-5 space-y-4 shadow-xl">
                <div className="flex items-center justify-between pb-2 border-b border-brand-border">
                  <div className="flex items-center gap-2">
                    <span className="font-mono font-extrabold text-white text-base">{path.id}</span>
                    <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-purple-500/20 text-purple-400 border border-purple-500/30">
                      Cross-Utility Risk
                    </span>
                  </div>
                  {getSeverityBadge(path.riskSeverity)}
                </div>

                <div className="space-y-2 text-xs">
                  <div className="text-slate-300 leading-relaxed bg-brand-dark p-3 rounded-lg border border-brand-border/60">
                    <span className="font-bold text-purple-400 block mb-1">Suspected Propagation Mechanism:</span>
                    {path.pathwayDescription}
                  </div>

                  <div className="grid grid-cols-2 gap-2 font-mono text-[11px] pt-1">
                    <div className="bg-brand-dark p-2 rounded border border-brand-border">
                      <span className="text-slate-500 text-[10px] block">Potable Pipe:</span>
                      <span className="text-brand-cyan font-bold">{path.potablePipeId}</span>
                    </div>
                    <div className="bg-brand-dark p-2 rounded border border-brand-border">
                      <span className="text-slate-500 text-[10px] block">Sewer Ingress Node:</span>
                      <span className="text-purple-400 font-bold">{path.sanitationNodeId}</span>
                    </div>
                    <div className="bg-brand-dark p-2 rounded border border-brand-border">
                      <span className="text-slate-500 text-[10px] block">Sub-atmospheric P:</span>
                      <span className="text-red-400 font-bold">{path.subAtmosphericPressure} bar</span>
                    </div>
                    <div className="bg-brand-dark p-2 rounded border border-brand-border">
                      <span className="text-slate-500 text-[10px] block">Pop. at Risk:</span>
                      <span className="text-amber-400 font-bold">≈ {path.affectedPopulationEstimate.toLocaleString()}</span>
                    </div>
                  </div>

                  {/* Downstream Affected Nodes */}
                  <div className="pt-2">
                    <span className="text-[11px] font-bold text-slate-400 block mb-1">Downstream Network Propagation Zone:</span>
                    <div className="flex flex-wrap gap-1.5">
                      {path.affectedDownstreamNodes.map((nodeId, idx) => (
                        <span key={idx} className="px-2 py-0.5 rounded bg-brand-surfaceLight border border-brand-border text-slate-300 text-[10px] font-mono">
                          {nodeId}
                        </span>
                      ))}
                    </div>
                  </div>

                  {/* Containment Protocol */}
                  <div className="p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-slate-200">
                    <span className="font-bold text-red-400 block mb-1 text-[11px]">Recommended Engineering Containment:</span>
                    <p className="text-[11px] leading-relaxed text-slate-300">{path.containmentProtocol}</p>
                  </div>
                </div>

                {/* Actions */}
                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => onLocateOnMap(path.potablePipeId)}
                    className="flex-1 py-2 bg-brand-surfaceLight hover:bg-brand-border border border-brand-border text-brand-cyan font-medium rounded-lg text-xs transition"
                  >
                    Locate on Spatial Map
                  </button>
                  <button
                    onClick={() => onInitiateContainment(path.id)}
                    className="flex-1 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold rounded-lg text-xs hover:brightness-110 transition"
                  >
                    {path.status === 'CONTAINMENT_ACTIVE' ? 'Containment Active' : 'Initiate Containment'}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- SUB-COMPONENT: ANALYTICS & REPORTS VIEW ---
    function AnalyticsReportsView({ pipes, anomalies, kpis, settings, onExportCSV, onPrintReport }) {

        <div className="space-y-6">

              <h1 className="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                <Icon name="barChart" className="w-6 h-6 text-brand-cyan" />

              <p className="text-xs text-slate-400 mt-1">

              </p>

            <div className="flex items-center gap-2">
              <button
                onClick={onExportCSV}

                <Icon name="download" className="w-3.5 h-3.5" />

              </button>

              </button>

          </div>

          {/* Mathematical Formulations Banner */}
          <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-4 space-y-2">
            <div className="text-[10px] uppercase font-mono font-bold text-slate-400">Financial Calculation Methodology</div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 font-mono text-xs">
              <div className="p-3 bg-brand-dark rounded-lg border border-brand-border/60">
                <span className="text-slate-400 block text-[11px] mb-1">Daily Loss Volume Formulation:</span>
                <span className="text-brand-cyan font-bold">V<sub className="text-[10px]">day</sub> = Q<sub className="text-[10px]">loss</sub> × 24 (m³/day)</span>
                <p className="text-[10px] text-slate-400 mt-1 font-sans">Current: {kpis.totalLossRate} m³/h × 24 = {(kpis.totalLossRate * 24).toFixed(1)} m³/day</p>
              </div>
              <div className="p-3 bg-brand-dark rounded-lg border border-brand-border/60">
                <span className="text-slate-400 block text-[11px] mb-1">Daily Financial Impact:</span>
                <span className="text-brand-cyan font-bold">C<sub className="text-[10px]">day</sub> = V<sub className="text-[10px]">day</sub> × C<sub className="text-[10px]">unit</sub> (₹/day)</span>
                <p className="text-[10px] text-slate-400 mt-1 font-sans">Unit Tariff: ₹{settings.unitWaterCostInr.toFixed(2)}/m³ → ₹{(kpis.dailyFinancial).toLocaleString('en-IN')}/day</p>
              </div>
            </div>
          </div>

          {/* Metrics Breakdown Cards */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-4">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Projected Monthly Drain</h3>
              <div className="text-2xl font-bold font-mono text-amber-400">₹{(kpis.monthlyFinancial).toLocaleString('en-IN')}</div>
              <div className="text-xs text-slate-400 mt-1">
                At present leakage rate across {kpis.burstCount + kpis.leakCount} detected loss points.
              </div>
            </div>

            <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-4">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Mean Time to Acknowledge (MTTA)</h3>
              <div className="text-2xl font-bold font-mono text-brand-cyan">4.2 <span className="text-xs font-normal text-slate-400">minutes</span></div>
              <div className="text-xs text-emerald-400 mt-1">
                92% faster than conventional manual acoustic patrols.
              </div>
            </div>

            <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-4">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Mean Time to Resolve (MTTR)</h3>
              <div className="text-2xl font-bold font-mono text-emerald-400">1.8 <span className="text-xs font-normal text-slate-400">hours</span></div>
              <div className="text-xs text-slate-400 mt-1">
                Simulated response time from detection to valve shutdown.
              </div>
            </div>
          </div>

          {/* Top Affected Segments Table */}
          <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-4 space-y-3">
            <h3 className="text-xs font-bold uppercase tracking-wider text-white">Top Revenue Drain Segments</h3>
            <table className="w-full text-left text-xs">
              <thead className="bg-brand-dark text-slate-400 font-mono uppercase text-[11px] border-b border-brand-border">
                <tr>
                  <th className="py-2.5 px-3">Pipe ID</th>
                  <th className="py-2.5 px-3">Location / Corridor</th>
                  <th className="py-2.5 px-3">Classification</th>
                  <th className="py-2.5 px-3">Loss Rate (m³/h)</th>
                  <th className="py-2.5 px-3">Daily Loss (m³)</th>
                  <th className="py-2.5 px-3">Daily Financial Impact (₹)</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-brand-border/40 font-mono">
                {pipes.filter(p => p.leakageRate > 0).sort((a,b) => b.leakageRate - a.leakageRate).map(p => (
                  <tr key={p.id} className="hover:bg-brand-surfaceLight/50">
                    <td className="py-2.5 px-3 font-bold text-brand-cyan">{p.id}</td>
                    <td className="py-2.5 px-3 font-sans text-slate-300">{p.name}</td>
                    <td className="py-2.5 px-3 font-sans">
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${getStatusStyle(p.status).bg} ${getStatusStyle(p.status).text}`}>
                        {getStatusStyle(p.status).label}
                      </span>
                    </td>
                    <td className="py-2.5 px-3 text-red-400 font-bold">{p.leakageRate}</td>
                    <td className="py-2.5 px-3 text-slate-300">{(p.leakageRate * 24).toFixed(1)}</td>
                    <td className="py-2.5 px-3 text-white font-bold">₹{(p.leakageRate * 24 * settings.unitWaterCostInr).toLocaleString('en-IN')}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- SUB-COMPONENT: SETTINGS & CALIBRATION VIEW ---
    function SettingsView({ settings, onSaveSettings, onResetData, onOpenInjectModal }) {
      const [form, setForm] = useState(settings);

      return (
        <div className="max-w-2xl space-y-6">
          <div className="pb-2 border-b border-brand-border/40">
            <h1 className="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
              <Icon name="settings" className="w-6 h-6 text-brand-cyan" />
              Hydraulic Physics & Twin Calibration Settings
            </h1>
            <p className="text-xs text-slate-400 mt-1">
              Configure fluid parameters, statistical anomaly sensitivity thresholds, and tariff models.
            </p>
          </div>

          <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-5 space-y-4">
            <div className="space-y-3 text-xs">
              <div>
                <label className="text-slate-300 font-semibold block mb-1">Municipal Water Unit Cost Tariff (₹/m³):</label>
                <input
                  type="number"
                  step="0.5"
                  value={form.unitWaterCostInr}
                  onChange={(e) => setForm({ ...form, unitWaterCostInr: parseFloat(e.target.value) || 0 })}
                  className="w-full bg-brand-dark border border-brand-border rounded-lg p-2 text-white font-mono"
                />
                <span className="text-[10px] text-slate-500 mt-0.5 block">Used for daily and monthly Non-Revenue Water (NRW) loss computations.</span>
              </div>

              <div>
                <label className="text-slate-300 font-semibold block mb-1">Anomaly Detection z-Score Threshold (σ):</label>
                <input
                  type="number"
                  step="0.1"
                  value={form.anomalyZThreshold}
                  onChange={(e) => setForm({ ...form, anomalyZThreshold: parseFloat(e.target.value) || 2.0 })}
                  className="w-full bg-brand-dark border border-brand-border rounded-lg p-2 text-white font-mono"
                />
                <span className="text-[10px] text-slate-500 mt-0.5 block">Statistical significance envelope: values exceeding threshold trigger micro-leak flag.</span>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-300 font-semibold block mb-1">Fluid Density ρ (kg/m³):</label>
                  <input
                    type="number"
                    value={form.fluidDensity}
                    onChange={(e) => setForm({ ...form, fluidDensity: parseFloat(e.target.value) || 1000 })}
                    className="w-full bg-brand-dark border border-brand-border rounded-lg p-2 text-white font-mono"
                  />
                </div>
                <div>
                  <label className="text-slate-300 font-semibold block mb-1">Gravitational Constant g (m/s²):</label>
                  <input
                    type="number"
                    step="0.01"
                    value={form.gravity}
                    onChange={(e) => setForm({ ...form, gravity: parseFloat(e.target.value) || 9.81 })}
                    className="w-full bg-brand-dark border border-brand-border rounded-lg p-2 text-white font-mono"
                  />
                </div>
              </div>
            </div>

            <div className="pt-3 border-t border-brand-border/40 flex justify-between">
              <button
                onClick={() => onSaveSettings(form)}
                className="px-4 py-2 rounded-lg bg-brand-cyan text-brand-darkest font-bold text-xs hover:brightness-110 transition"
              >
                Save Physics Calibration
              </button>
            </div>
          </div>

          {/* Developer / Demo Sandbox Tools */}
          <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-5 space-y-3">
            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Live Presentation Tools</h3>
            <p className="text-xs text-slate-400">
              Inject synthetic bursts, micro-leaks, or reset mock records for project demonstrations.
            </p>
            <div className="flex gap-3 pt-2">
              <button
                onClick={onOpenInjectModal}
                className="px-3 py-2 rounded-lg bg-brand-surfaceLight border border-brand-cyan/40 text-brand-cyan font-bold text-xs hover:bg-brand-cyan/20 transition"
              >
                Inject Custom Anomaly
              </button>
              <button
                onClick={onResetData}
                className="px-3 py-2 rounded-lg bg-brand-surfaceLight border border-brand-border text-slate-300 text-xs hover:text-white transition"
              >
                Reset Demo Baseline Data
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL: INJECT CUSTOM ANOMALY ---
    function InjectAnomalyModal({ pipes, onClose, onInject }) {
      const [pipeId, setPipeId] = useState(pipes[0]?.id || 'P-101');
      const [category, setCategory] = useState('CRITICAL_BURST');
      const [severity, setSeverity] = useState('CRITICAL');
      const [customDrop, setCustomDrop] = useState(2.2);

      const targetPipe = pipes.find(p => p.id === pipeId) || pipes[0];

      const handleConfirm = () => {
        const expected = targetPipe.expectedPressureDownstream;
        const actual = Math.max(0.1, Number((expected - customDrop).toFixed(2)));
        const deltaP = Number((actual - expected).toFixed(2));
        const zScore = Number((deltaP / (targetPipe.pressureSigma || 0.25)).toFixed(2));
        const lossRate = category === 'CRITICAL_BURST' ? 32.0 : category === 'MICRO_LEAK' ? 5.2 : 4.0;

        const newAnomaly = {
          id: `ANOM-${Date.now().toString().slice(-4)}`,
          pipeId: targetPipe.id,
          nodeId: targetPipe.toNodeId,
          zone: targetPipe.zone,
          category,
          severity,
          expectedPressure: expected,
          actualPressure: actual,
          deltaP,
          zScore,
          estimatedWaterLoss: lossRate,
          confidenceScore: 96.5,
          detectedAt: 'Just now (Simulated)',
          status: 'ACTIVE',
          description: `Simulated ${category} on ${targetPipe.diameter}mm ${targetPipe.material} segment ${targetPipe.id}.`,
          recommendedAction: 'Immediate field dispatch for acoustic correlation and isolation valve throttle.',
          assignedTeam: 'Unassigned'
        };

        const updatedPipe = {
          ...targetPipe,
          status: category,
          actualPressureDownstream: actual,
          leakageRate: lossRate,
          anomalyConfidence: 96.5,
          recommendedAction: newAnomaly.recommendedAction
        };

        onInject(newAnomaly, updatedPipe);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-brand-dark border border-brand-border rounded-xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between items-center pb-2 border-b border-brand-border">
              <h3 className="font-bold text-white text-sm flex items-center gap-2">
                <Icon name="zap" className="w-4 h-4 text-brand-cyan" />
                Inject Simulated Anomaly
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="space-y-3 text-xs">
              <div>
                <label className="text-slate-300 block mb-1 font-medium">Select Target Pipe:</label>
                <select
                  value={pipeId}
                  onChange={(e) => setPipeId(e.target.value)}
                  className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white"
                >
                  {pipes.map(p => (
                    <option key={p.id} value={p.id}>{p.id} — {p.name} ({p.diameter}mm)</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="text-slate-300 block mb-1 font-medium">Anomaly Classification:</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white"
                >
                  <option value="CRITICAL_BURST">Critical Pipe Burst (Major Rupture)</option>
                  <option value="MICRO_LEAK">Minor Degradation / Micro-leak</option>
                  <option value="CONTAMINATION_BLOCKAGE">Contamination / Negative Pressure / Blockage</option>
                </select>
              </div>

              <div>
                <label className="text-slate-300 block mb-1 font-medium">Pressure Deficit Drop (bar):</label>
                <input
                  type="number"
                  step="0.1"
                  value={customDrop}
                  onChange={(e) => setCustomDrop(parseFloat(e.target.value) || 0.5)}
                  className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white font-mono"
                />
              </div>
            </div>

            <div className="pt-2 flex justify-end gap-2">
              <button onClick={onClose} className="px-3 py-1.5 rounded-lg bg-brand-surface text-slate-300 text-xs">Cancel</button>
              <button onClick={handleConfirm} className="px-4 py-1.5 rounded-lg bg-brand-cyan text-brand-darkest font-bold text-xs hover:brightness-110">Inject Live</button>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL: CREATE WORK ORDER ---
    function CreateWorkOrderModal({ initialData, pipes, onClose, onCreate }) {
      const [pipeId, setPipeId] = useState(initialData?.pipeId || pipes[0]?.id || 'P-101');
      const [priority, setPriority] = useState(initialData?.severity || 'HIGH');
      const [assignedTeam, setAssignedTeam] = useState('Rapid Rupture Repair Crew Alpha');
      const [technician, setTechnician] = useState('Er. S. Nair');
      const [desc, setDesc] = useState(initialData?.description || 'Investigate sudden pressure drop and acoustic transient.');

      const handleSave = () => {
        const newWO = {
          id: `WO-2026-${Date.now().toString().slice(-4)}`,
          anomalyId: initialData?.id || 'ANOM-MANUAL',
          pipeId,
          zone: 'ZONE_1',
          priority,
          category: initialData?.category || 'CRITICAL_BURST',
          issueDescription: desc,
          assignedTeam,
          assignedTechnician: technician,
          createdAt: 'Just now',
          targetResponseTime: priority === 'CRITICAL' ? 'SLA: 45 mins' : 'SLA: 4 hours',
          status: 'ASSIGNED',
          estimatedCost: 45000
        };
        onCreate(newWO);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-brand-dark border border-brand-border rounded-xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between items-center pb-2 border-b border-brand-border">
              <h3 className="font-bold text-white text-sm flex items-center gap-2">
                <Icon name="wrench" className="w-4 h-4 text-brand-cyan" />
                Dispatch Emergency Work Order
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="space-y-3 text-xs">
              <div>
                <label className="text-slate-300 block mb-1 font-medium">Pipe Segment:</label>
                <select value={pipeId} onChange={(e) => setPipeId(e.target.value)} className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white">
                  {pipes.map(p => <option key={p.id} value={p.id}>{p.id} — {p.name}</option>)}
                </select>
              </div>

              <div>
                <label className="text-slate-300 block mb-1 font-medium">Response Priority:</label>
                <select value={priority} onChange={(e) => setPriority(e.target.value)} className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white">
                  <option value="CRITICAL">Critical (Immediate SLA 45m)</option>
                  <option value="HIGH">High (SLA 2h)</option>
                  <option value="MEDIUM">Medium (SLA 4h)</option>
                  <option value="LOW">Low (SLA 24h)</option>
                </select>
              </div>

              <div>
                <label className="text-slate-300 block mb-1 font-medium">Allocated Response Team:</label>
                <select value={assignedTeam} onChange={(e) => setAssignedTeam(e.target.value)} className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white">
                  <option value="Rapid Rupture Repair Crew Alpha">Rapid Rupture Repair Crew Alpha</option>
                  <option value="Acoustic Leak Detection Team Beta">Acoustic Leak Detection Team Beta</option>
                  <option value="Sanitation Emergency Hazmat Squad">Sanitation Emergency Hazmat Squad</option>
                  <option value="Drainage & Jetting Unit 4">Drainage & Jetting Unit 4</option>
                </select>
              </div>

              <div>
                <label className="text-slate-300 block mb-1 font-medium">Work Description & Instructions:</label>
                <textarea value={desc} onChange={(e) => setDesc(e.target.value)} rows="3" className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white"></textarea>
              </div>
            </div>

            <div className="pt-2 flex justify-end gap-2">
              <button onClick={onClose} className="px-3 py-1.5 rounded-lg bg-brand-surface text-slate-300 text-xs">Cancel</button>
              <button onClick={handleSave} className="px-4 py-1.5 rounded-lg bg-brand-cyan text-brand-darkest font-bold text-xs hover:brightness-110">Dispatch Crew</button>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL: RESOLVE ANOMALY CONFIRMATION ---
    function ResolveAnomalyDialog({ anomaly, onClose, onConfirm }) {
      const [notes, setNotes] = useState('Repaired mechanical coupling clamp. Hydrostatic pressure verified stable.');

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-brand-dark border border-brand-border rounded-xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between items-center pb-2 border-b border-brand-border">
              <h3 className="font-bold text-white text-sm flex items-center gap-2">
                <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
                Confirm Incident Remediation
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="text-xs text-slate-300 space-y-2">
              <p>
                Marking anomaly <span className="font-mono font-bold text-white">{anomaly.id}</span> on pipe <span className="font-mono text-brand-cyan font-bold">{anomaly.pipeId}</span> as Resolved.
              </p>
              <div>
                <label className="text-slate-400 block mb-1 font-medium">Remediation Closure Log:</label>
                <textarea
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  rows="3"
                  className="w-full bg-brand-surface border border-brand-border rounded-lg p-2 text-white text-xs"
                />
              </div>
            </div>

            <div className="pt-2 flex justify-end gap-2">
              <button onClick={onClose} className="px-3 py-1.5 rounded-lg bg-brand-surface text-slate-300 text-xs">Cancel</button>
              <button onClick={() => onConfirm(notes)} className="px-4 py-1.5 rounded-lg bg-emerald-500 text-brand-darkest font-bold text-xs hover:brightness-110">Confirm & Close</button>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL: EXECUTIVE BRIEFING PRINT REPORT ---
    function ExecutiveReportModal({ kpis, anomalies, pipes, workOrders, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md overflow-y-auto p-6 flex justify-center">
          <div className="bg-white text-slate-900 rounded-xl max-w-3xl w-full p-8 shadow-2xl relative space-y-6 my-auto font-sans">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-500 hover:text-black font-bold text-lg">✕</button>

            {/* Header */}
            <div className="border-b-2 border-slate-900 pb-4 flex justify-between items-start">
              <div>
                <h1 className="text-2xl font-black tracking-tight text-slate-900">PIPEGRAPH EXECUTIVE TELEMETRY BRIEFING</h1>
                <p className="text-xs text-slate-600 mt-0.5">Municipal Water Distribution & Sanitation Digital Twin Operations Center</p>
              </div>
              <div className="text-right text-xs font-mono">
                <div>Date: {new Date().toLocaleDateString('en-GB')}</div>
                <div className="font-bold text-emerald-700">STATUS: AUDITED</div>
              </div>
            </div>

            {/* Summary Metrics */}
            <div className="grid grid-cols-4 gap-4 p-4 bg-slate-50 rounded-lg border border-slate-200 text-center">
              <div>
                <div className="text-[10px] text-slate-500 uppercase font-bold">Network Length</div>
                <div className="text-lg font-bold text-slate-900">{kpis.totalLengthKm} km</div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 uppercase font-bold">Health Score</div>
                <div className="text-lg font-bold text-emerald-600">{kpis.healthScore}%</div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 uppercase font-bold">Loss Rate</div>
                <div className="text-lg font-bold text-amber-600">{kpis.totalLossRate} m³/h</div>
              </div>
              <div>
                <div className="text-[10px] text-slate-500 uppercase font-bold">Daily Cost</div>
                <div className="text-lg font-bold text-slate-900">₹{(kpis.dailyFinancial).toLocaleString('en-IN')}</div>
              </div>
            </div>

            {/* Critical Anomalies Table */}
            <div>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 mb-2">High & Critical Priority Infrastructure Incidents</h3>
              <table className="w-full text-left text-xs border border-slate-200">
                <thead className="bg-slate-100 text-slate-700 font-mono text-[10px] uppercase">
                  <tr>
                    <th className="p-2 border">Anomaly ID</th>
                    <th className="p-2 border">Pipe ID</th>
                    <th className="p-2 border">Category</th>
                    <th className="p-2 border">ΔP (bar)</th>
                    <th className="p-2 border">Loss Rate</th>
                    <th className="p-2 border">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {anomalies.filter(a => a.severity === 'CRITICAL' || a.severity === 'HIGH').map(a => (
                    <tr key={a.id}>
                      <td className="p-2 border font-mono font-bold">{a.id}</td>
                      <td className="p-2 border font-mono">{a.pipeId}</td>
                      <td className="p-2 border">{a.category}</td>
                      <td className="p-2 border font-mono text-red-600">{a.deltaP} bar</td>
                      <td className="p-2 border font-mono">{a.estimatedWaterLoss} m³/h</td>
                      <td className="p-2 border font-semibold">{a.status}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Engineering Recommendation Signature */}
            <div className="pt-6 border-t border-slate-200 flex justify-between items-end text-xs text-slate-600">
              <div>
                <div className="font-semibold text-slate-900">Prepared by: AI Digital Twin Engine (PINN-Graph v2.4)</div>
                <div>Supervised by: Er. S. Ramanujan, Chief Hydraulic Engineer</div>
              </div>
              <button
                onClick={() => window.print()}
                className="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-bold hover:bg-slate-800 transition no-print"
              >
                Print PDF Report
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- INITIALIZE REACT APPLICATION ---
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
