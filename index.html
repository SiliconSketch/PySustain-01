    }

    /* Pulsing animations for digital twin map */
    @keyframes pulse-burst {
      0%, 100% { r: 10; opacity: 0.9; stroke-width: 3; }
      50% { r: 18; opacity: 0.2; stroke-width: 6; }
    }
    @keyframes pulse-leak {
      0%, 100% { r: 8; opacity: 0.8; }
      50% { r: 14; opacity: 0.3; }
    }
    @keyframes pulse-contamination {

    }
    @keyframes flow-dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    .anim-burst {
      animation: pulse-burst 1.6s infinite ease-out;
      transform-origin: center;
    }
    .anim-leak {
      animation: pulse-leak 2.2s infinite ease-out;
      transform-origin: center;
    }
    .anim-contamination {
      animation: pulse-contamination 1.8s infinite ease-out;
      transform-origin: center;
    }
    .flow-line-normal {
      stroke-dasharray: 6 8;
      animation: flow-dash 2s linear infinite;
    }
    .flow-line-fast {
      stroke-dasharray: 6 6;
      animation: flow-dash 0.9s linear infinite;
    }
    .flow-line-slow {
      stroke-dasharray: 4 10;
      animation: flow-dash 4s linear infinite;
    }
    .glow-cyan {

    .glow-red {

    function createPipeSensors(pipe) {
  const isContaminated = pipe.id === 'P-23-24';
  const isBurst = pipe.id === 'P-03-04';
  const isMicroLeak = pipe.id === 'P-11-12' || pipe.id === 'P-17-18';
  const isBlockage = pipe.id === 'P-18-19';

  if (pipe.isSanitation) {
    return [
      {
        id: `SEN-${pipe.id}-M`,
        pipeId: pipe.id,
        name: `Trunk Ingress Sensor [${pipe.fromNodeId} ↔ ${pipe.toNodeId}]`,
        positionPercent: 50,
        sensorType: 'SEWAGE_INGRESS',
        status: pipe.status === 'CONTAMINATION_BLOCKAGE' ? 'ALARM_CONTAMINATION' : 'ONLINE',
        parameters: {
          turbidityNtu: 18.5,
          freeChlorineMgL: 0.02,
          phLevel: 7.2,
          eColiCfuPer100ml: 12000,
          ammoniaPpm: 6.8,
          h2sLevelPpm: 2.4,
          lastReadingTimestamp: 'Just now'
        },
        alarmTriggered: pipe.status === 'CONTAMINATION_BLOCKAGE',
        alertSummary: pipe.status === 'CONTAMINATION_BLOCKAGE' ? 'Surcharge sewer head detected exceeding pipe crown.' : undefined
      }
    ];
  }

  // Potable pipes: deploy dual sensors at 30% and 70% span along the pipe
  return [
    {
      id: `SEN-${pipe.id}-A`,
      pipeId: pipe.id,
      name: `Optical Quality Sensor A [${pipe.fromNodeId} +30%]`,
      positionPercent: 30,
      sensorType: isContaminated ? 'SEWAGE_INGRESS' : 'WATER_QUALITY_MULTI',
      status: isContaminated ? 'ALARM_CONTAMINATION' : (isMicroLeak ? 'WARNING' : 'ONLINE'),
      parameters: {
        turbidityNtu: isContaminated ? 6.2 : (isMicroLeak ? 1.4 : 0.35),
        freeChlorineMgL: isContaminated ? 0.05 : (isMicroLeak ? 1.2 : 1.8),
        phLevel: isContaminated ? 6.1 : 7.4,
        eColiCfuPer100ml: isContaminated ? 340 : 0,
        ammoniaPpm: isContaminated ? 3.4 : 0.04,
        h2sLevelPpm: isContaminated ? 0.8 : 0.0,
        lastReadingTimestamp: 'Just now'
      },
      alarmTriggered: isContaminated,
      alertSummary: isContaminated 
        ? 'CRITICAL SEWAGE INGRESS: Free chlorine depleted to 0.05 mg/L, Ammonia spiked to 3.4 ppm, E. coli 340 CFU/100ml.' 
        : undefined
    },
    {
      id: `SEN-${pipe.id}-B`,
      pipeId: pipe.id,
      name: `Microbial & Acoustic Sensor B [${pipe.toNodeId} -30%]`,
      positionPercent: 70,
      sensorType: isBurst ? 'ACOUSTIC_LEAK' : (isContaminated ? 'MICROBIAL_FLUORESCENCE' : 'WATER_QUALITY_MULTI'),
      status: (isContaminated || isBurst) ? 'ALARM_CONTAMINATION' : 'ONLINE',
      parameters: {
        turbidityNtu: isContaminated ? 7.8 : (isBurst ? 3.8 : 0.4),
        freeChlorineMgL: isContaminated ? 0.02 : 1.7,
        phLevel: isContaminated ? 5.9 : 7.3,
        eColiCfuPer100ml: isContaminated ? 520 : 0,
        ammoniaPpm: isContaminated ? 4.1 : 0.02,
        h2sLevelPpm: isContaminated ? 1.1 : 0.0,
        lastReadingTimestamp: 'Just now'
      },
      alarmTriggered: isContaminated || isBurst,
      alertSummary: isContaminated 
        ? 'Severe microbial fluorescence: Coliform density >500 CFU, sewer back-siphonage ingress confirmed.'
        : (isBurst ? 'Extreme acoustic high-frequency rush: Major structural rupture detected.' : undefined)
    }
  ];
}

    const getStatusStyle = (status) => {

          return { bg: 'bg-purple-500/15', text: 'text-purple-400', border: 'border-purple-500/40', stroke: '#A855F7', label: 'Contamination / Blockage' };

          return { bg: 'bg-slate-500/10', text: 'text-slate-400', border: 'border-slate-500/30', stroke: '#94A3B8', label: status };

    };

    const getSeverityBadge = (severity) => {
      switch (severity) {
        case 'CRITICAL': return <span className="px-2 py-0.5 text-xs font-semibold rounded bg-red-500/20 text-red-400 border border-red-500/30 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-red-400 animate-ping"></span>Critical</span>;

        case 'LOW': return <span className="px-2 py-0.5 text-xs font-semibold rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">Low</span>;
        default: return <span className="px-2 py-0.5 text-xs font-semibold rounded bg-slate-500/20 text-slate-400">Info</span>;

    // --- MAIN APP COMPONENT ---
    function App() {
      // Navigation tab
      const [activeTab, setActiveTab] = useState('overview');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      // Filters & Search
      const [selectedZone, setSelectedZone] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [timeRange, setTimeRange] = useState('24h');

      // State stores (persisted to localStorage with automatic version migration)
      const [nodes, setNodes] = useState(() => {
        const saved = localStorage.getItem('pipegraph_nodes_v4_parallel');
        return saved ? JSON.parse(saved) : RAW_NODES;
      });
      const [pipes, setPipes] = useState(() => {
        const saved = localStorage.getItem('pipegraph_pipes_v4_parallel');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.some(p => p.id === 'P-23-24-SEW') && parsed.some(p => p.id === 'P-18-23-SEW')) {
              return parsed;
            }
          } catch (e) {}
        }
        return RAW_PIPES;
      });
      const [anomalies, setAnomalies] = useState(() => {
        const saved = localStorage.getItem('pipegraph_anomalies_v4_parallel');
        return saved ? JSON.parse(saved) : RAW_ANOMALIES;
      });
      const [workOrders, setWorkOrders] = useState(() => {
        const saved = localStorage.getItem('pipegraph_workorders_v4_parallel');
        return saved ? JSON.parse(saved) : RAW_WORK_ORDERS;
      });
      const [contaminationPaths, setContaminationPaths] = useState(() => {
        const saved = localStorage.getItem('pipegraph_contamination_v4_parallel');
        return saved ? JSON.parse(saved) : RAW_CONTAMINATION_PATHS;
      });

      // Settings
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('pipegraph_settings');
        return saved ? JSON.parse(saved) : {
          unitWaterCostInr: 22.50,
          fluidDensity: 1000,
          gravity: 9.81,
          anomalyZThreshold: 2.0,
          liveTickerSpeed: '1X',
          activeZoneFilter: 'ALL'
        };
      });

      const [selectedPipeId, setSelectedPipeId] = useState('P-03-04'); // default focus on burst
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const [isDetailDrawerOpen, setIsDetailDrawerOpen] = useState(true);

      // Map View Settings
      const [layerWater, setLayerWater] = useState(true);
      const [layerSewer, setLayerSewer] = useState(true);
      const [layerPressureHeatmap, setLayerPressureHeatmap] = useState(false);
      const [layerFlowArrows, setLayerFlowArrows] = useState(true);
      const [layerAnomalies, setLayerAnomalies] = useState(true);
      const [layerSensors, setLayerSensors] = useState(true);

      // Modals
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showInjectModal, setShowInjectModal] = useState(false);
      const [showWorkOrderModal, setShowWorkOrderModal] = useState(false);
      const [workOrderInitialData, setWorkOrderInitialData] = useState(null);
      const [resolveModalData, setResolveModalData] = useState(null);
      const [printPreviewMode, setPrintPreviewMode] = useState(false);

      // Interactive Mathematical Simulator state for selected item
      const [simulatedPressureSlider, setSimulatedPressureSlider] = useState(2.45);

      // Toasts
      const [toasts, setToasts] = useState([]);
      const addToast = (title, message, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      // Sync to localStorage
      useEffect(() => {
        localStorage.setItem('pipegraph_nodes_v4_parallel', JSON.stringify(nodes));
        localStorage.setItem('pipegraph_pipes_v4_parallel', JSON.stringify(pipes));
        localStorage.setItem('pipegraph_anomalies_v4_parallel', JSON.stringify(anomalies));
        localStorage.setItem('pipegraph_workorders_v4_parallel', JSON.stringify(workOrders));
        localStorage.setItem('pipegraph_settings', JSON.stringify(settings));
      }, [nodes, pipes, anomalies, workOrders, settings]);

      // Selected pipe object
      const selectedPipe = useMemo(() => {
        return pipes.find(p => p.id === selectedPipeId) || pipes[0];
      }, [pipes, selectedPipeId]);

      // Update simulation slider when selected pipe changes
      useEffect(() => {
        if (selectedPipe) {
          setSimulatedPressureSlider(selectedPipe.actualPressureDownstream);
        }
      }, [selectedPipeId]);

      // Upstream & Downstream Lineage for selected pipe
      const lineage = useMemo(() => {
        if (!selectedPipe) return { upstreamPipes: [], downstreamPipes: [], upstreamNodes: [], downstreamNodes: [] };
        const upPipes = pipes.filter(p => p.toNodeId === selectedPipe.fromNodeId).map(p => p.id);
        const downPipes = pipes.filter(p => p.fromNodeId === selectedPipe.toNodeId).map(p => p.id);
        return {
          upstreamPipes: upPipes,
          downstreamPipes: downPipes,
          upstreamNodes: [selectedPipe.fromNodeId],
          downstreamNodes: [selectedPipe.toNodeId]
        };
      }, [selectedPipe, pipes]);

      // Mathematical calculations for current selected pipe and simulated slider
      const mathAnalysis = useMemo(() => {
        if (!selectedPipe) return null;
        const expectedP = selectedPipe.expectedPressureDownstream;
        const actualP = Number(simulatedPressureSlider);
        const sigma = selectedPipe.pressureSigma || 0.25;
        const deltaP = Number((actualP - expectedP).toFixed(3));
        const zScore = Number((deltaP / sigma).toFixed(2));
        
        let classification = 'NORMAL';
        let leakRate = 0;
        let explanation = '';

        if (actualP <= 0.2 || (deltaP < -1.5 && actualP < 1.0)) {
          classification = 'CONTAMINATION_BLOCKAGE';
          leakRate = 12.5;
          explanation = `Sub-atmospheric pressure (${actualP.toFixed(2)} bar, z = ${zScore}σ). Severe hydraulic depression creates back-siphonage suction from adjacent groundwater or sewer lines.`;
        } else if (zScore <= -3.0 || deltaP <= -1.2) {
          classification = 'CRITICAL_BURST';
          leakRate = Number((Math.min(45, 12 + Math.abs(deltaP) * 10)).toFixed(1));
          explanation = `Major hydraulic collapse (${deltaP.toFixed(2)} bar drop, z = ${zScore}σ). Pressure profile indicates severe structural pipe rupture with massive water discharge.`;
        } else if (zScore <= -settings.anomalyZThreshold || deltaP <= -0.25) {
          classification = 'MICRO_LEAK';
          leakRate = Number((Math.min(8, 1.2 + Math.abs(deltaP) * 4)).toFixed(1));
          explanation = `Persistent pressure depression (${deltaP.toFixed(2)} bar, z = ${zScore}σ). Acoustic and headloss signature indicates joint leakage or pinhole failure.`;
        } else if (zScore >= settings.anomalyZThreshold && deltaP >= 0.6) {
          classification = 'CONTAMINATION_BLOCKAGE';
          leakRate = 0;
          explanation = `Abnormal upstream head accumulation (+${deltaP.toFixed(2)} bar, z = +${zScore}σ) alongside flow velocity reduction indicates internal hydraulic choking or blockage.`;
        } else {
          classification = 'NORMAL';
          leakRate = 0;
          explanation = `Operating normally within statistical confidence envelope (z = ${zScore}σ). Hydraulic head loss matches expected Darcy-Weisbach gradient.`;
        }

        const dailyLossM3 = Number((leakRate * 24).toFixed(1));
        const dailyCostInr = Math.round(dailyLossM3 * settings.unitWaterCostInr);

        return {
          expectedP,
          actualP,
          deltaP,
          zScore,
          classification,
          leakRate,
          dailyLossM3,
          dailyCostInr,
          explanation
        };
      }, [selectedPipe, simulatedPressureSlider, settings]);

      // KPI Aggregations
      const kpis = useMemo(() => {
        const totalLengthKm = Number((pipes.reduce((acc, p) => acc + p.length, 0) / 1000).toFixed(1));
        const monitoredPipes = pipes.length;
        const activeAnomalies = anomalies.filter(a => a.status !== 'RESOLVED').length;
        const totalLossRate = Number(pipes.reduce((acc, p) => acc + (p.leakageRate || 0), 0).toFixed(1));
        const dailyLossM3 = Number((totalLossRate * 24).toFixed(1));
        const dailyFinancial = Math.round(dailyLossM3 * settings.unitWaterCostInr);
        const monthlyFinancial = Math.round(dailyFinancial * 30);
        
        // Health score: 100 - (penalties for bursts, leaks, blockages)
        const burstCount = pipes.filter(p => p.status === 'CRITICAL_BURST').length;
        const leakCount = pipes.filter(p => p.status === 'MICRO_LEAK').length;
        const contamCount = pipes.filter(p => p.status === 'CONTAMINATION_BLOCKAGE').length;
        const healthScore = Math.max(60, Number((100 - (burstCount * 12) - (leakCount * 4) - (contamCount * 8)).toFixed(1)));

        return {
          totalLengthKm,
          monitoredPipes,
          activeAnomalies,
          totalLossRate,
          dailyFinancial,
          monthlyFinancial,
          healthScore,
          burstCount,
          leakCount,
          contamCount
        };
      }, [pipes, anomalies, settings]);

      // Handlers
      const handleAcknowledgeAnomaly = (anomId) => {
        setAnomalies(prev => prev.map(a => a.id === anomId ? { ...a, status: 'ACKNOWLEDGED' } : a));
        addToast('Alert Acknowledged', `Anomaly ${anomId} marked acknowledged.`, 'info');
      };

        setSelectedPipeId(pipeId);
        setActiveTab('map');
        setIsDetailDrawerOpen(true);
        addToast('Map Focus', `Focused on pipe segment ${pipeId}.`, 'info');
      };

        setWorkOrderInitialData(anomaly);
        setShowWorkOrderModal(true);
      };

      const handleResolveAnomalyPrompt = (anomaly) => {
        setResolveModalData(anomaly);
      };

      const confirmResolveAnomaly = (notes) => {
        if (!resolveModalData) return;
        const anomId = resolveModalData.id;
        const pId = resolveModalData.pipeId;

        // Update anomaly
        setAnomalies(prev => prev.map(a => a.id === anomId ? { ...a, status: 'RESOLVED' } : a));
        // Update pipe to NORMAL
        setPipes(prev => prev.map(p => p.id === pId ? { ...p, status: 'NORMAL', leakageRate: 0, anomalyConfidence: 0 } : p));
        // Update work order if linked
        setWorkOrders(prev => prev.map(w => w.anomalyId === anomId ? { ...w, status: 'RESOLVED', resolutionNotes: notes || 'Remediated & pressure normalized.' } : w));

        addToast('Anomaly Resolved', `Incident ${anomId} marked resolved. Pipe ${pId} returned to Normal Operations.`, 'success');
        setResolveModalData(null);
      };

      // Smart Dispatch Simulation Trigger
      const runSmartDispatchSimulation = () => {
        let dispatchedCount = 0;
        setAnomalies(prev => prev.map(a => {
          if (a.status === 'ACTIVE' && a.severity === 'CRITICAL') {
            dispatchedCount++;
            return {
              ...a,
              status: 'DISPATCHED',
              assignedTeam: a.category === 'CRITICAL_BURST' ? 'Rapid Rupture Repair Crew Alpha' : 'Sanitation Hazmat Squad'
            };
          }
          return a;

        setWorkOrders(prev => prev.map(w => {
          if (w.status === 'OPEN' && (w.priority === 'CRITICAL' || w.priority === 'HIGH')) {
            return {
              ...w,
              status: 'ASSIGNED',
              assignedTechnician: w.assignedTeam.includes('Rupture') ? 'Sr. Foreman R. Verma (En Route)' : 'Tech Specialist Auto-Assigned',
              resolutionNotes: 'Dispatched via AI Multi-Criteria Optimization Rule Engine.'

          return w;

      const handleExportCSV = () => {
        const headers = ["Anomaly ID", "Pipe ID", "Zone", "Category", "Severity", "Expected Pressure (bar)", "Actual Pressure (bar)", "Delta P (bar)", "z-Score", "Est Water Loss (m3/h)", "AI Confidence (%)", "Status"];
        const rows = anomalies.map(a => [
          a.id, a.pipeId, a.zone, a.category, a.severity, a.expectedPressure, a.actualPressure, a.deltaP, a.zScore, a.estimatedWaterLoss, a.confidenceScore, a.status
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `PipeGraph_Telemetry_Report_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();

      };

      // Reset mock data to initial
      const handleResetData = () => {
        setNodes(RAW_NODES);
        setPipes(RAW_PIPES);
        setAnomalies(RAW_ANOMALIES);
        setWorkOrders(RAW_WORK_ORDERS);

        localStorage.removeItem('pipegraph_anomalies_v4_parallel');

        localStorage.removeItem('pipegraph_contamination_v4_parallel');

          <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm">
            {toasts.map(t => (

                </div>

                  </div>

                { id: 'map', label: 'Digital Twin Map', icon: 'map', badge: 'Live' },
                { id: 'health', label: 'Network Health', icon: 'shield', badge: `${kpis.healthScore}%` },
                { id: 'anomalies', label: 'Anomaly Detection', icon: 'shieldAlert', badge: kpis.activeAnomalies, badgeColor: 'bg-red-500/20 text-red-400' },
                { id: 'contamination', label: 'Contamination Risks', icon: 'droplets', badge: contaminationPaths.length, badgeColor: 'bg-purple-500/20 text-purple-400' },
                { id: 'workorders', label: 'Work Orders', icon: 'wrench', badge: workOrders.filter(w => w.status !== 'RESOLVED').length },
                { id: 'analytics', label: 'Analytics & Reports', icon: 'barChart', badge: null },
                { id: 'settings', label: 'Settings & Calib.', icon: 'settings', badge: null },
              ].map(item => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium transition-all ${
                      isActive 
                        ? 'bg-brand-cyan/15 text-brand-cyan border border-brand-cyan/30 shadow-sm shadow-cyan-900/30' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-brand-surface/60'
                    }`}
                  >
                    <Icon name={item.icon} className={`w-4 h-4 shrink-0 ${isActive ? 'text-brand-cyan' : 'text-slate-400'}`} />
                    {!sidebarCollapsed && (
                      <span className="flex-1 text-left truncate">{item.label}</span>
                    )}
                    {!sidebarCollapsed && item.badge && (
                      <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-mono font-bold ${item.badgeColor || 'bg-brand-surfaceLight text-slate-300'}`}>
                        {item.badge}
                      </span>

                  </button>
                );

            </nav>

            {/* Sidebar Bottom: Connected status & User */}
            <div className="p-3 border-t border-brand-border/60 bg-brand-surface/40">
              <div className="flex items-center gap-2 mb-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                {!sidebarCollapsed && (
                  <div className="text-[11px] font-mono text-emerald-400">Twin Synced (Physics PINN)</div>
                )}
              </div>
              <div className="flex items-center gap-2.5 pt-2 border-t border-brand-border/30">
                <div className="w-7 h-7 rounded-full bg-brand-surfaceLight border border-brand-border flex items-center justify-center text-slate-300">
                  <Icon name="user" className="w-3.5 h-3.5" />
                </div>
                {!sidebarCollapsed && (
                  <div className="overflow-hidden">
                    <div className="text-xs font-semibold text-white truncate">Er. S. Ramanujan</div>
                    <div className="text-[10px] text-slate-400 truncate">Chief Hydraulic Engineer</div>
                  </div>
                )}
              </div>
            </div>
          </aside>

          {/* MAIN WORKSPACE WRAPPER */}
          <div className="flex-1 flex flex-col overflow-hidden">
            {/* TOP HEADER */}
            <header className="h-16 border-b border-brand-border bg-brand-dark/95 backdrop-blur px-6 flex items-center justify-between z-20">
              {/* Breadcrumbs & Title */}
              <div className="flex items-center gap-3">
                <span className="text-xs font-mono text-slate-400">ZONE:</span>
                <select
                  value={selectedZone}
                  onChange={(e) => setSelectedZone(e.target.value)}
                  className="bg-brand-surface text-slate-200 border border-brand-border rounded-lg text-xs px-2.5 py-1.5 focus:outline-none focus:border-brand-cyan"
                >
                  {ZONES_LIST.map(z => (
                    <option key={z.id} value={z.id}>{z.name}</option>
                  ))}
                </select>

                <div className="h-4 w-px bg-brand-border"></div>

                {/* Time Range */}
                <div className="flex items-center bg-brand-surface border border-brand-border rounded-lg p-0.5 text-xs">
                  {['1h', '6h', '24h', '7d'].map(t => (
                    <button
                      key={t}
                      onClick={() => setTimeRange(t)}
                      className={`px-2 py-1 rounded text-[11px] font-medium transition ${timeRange === t ? 'bg-brand-cyan text-brand-darkest font-bold' : 'text-slate-400 hover:text-white'}`}
                    >

                    </button>
                  ))}
                </div>

                {/* DEMO DATA BADGE */}
                <div className="hidden lg:flex items-center gap-1.5 px-2 py-1 rounded bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[11px] font-mono">
                  <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                  DEMO DATA / SIMULATION ACTIVE
                </div>
              </div>

              {/* Right Controls */}
              <div className="flex items-center gap-3">
                {/* Search */}
                <div className="relative hidden md:block">
                  <Icon name="search" className="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Search pipe ID, junction, street..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}

                  <Icon name="zap" className="w-3.5 h-3.5 text-brand-cyan" />
                  <span>Inject Anomaly</span>
                </button>

                  <span>AI Dispatch</span>
                </button>

                {/* Notifications Bell */}
                <div className="relative cursor-pointer" onClick={() => setActiveTab('anomalies')}>

                {/* Refresh */}
                <button 
                  onClick={() => addToast('Telemetry Refreshed', 'PINN model recalculated pressure gradients across 1,842 pipe segments.', 'info')}
                  className="w-8 h-8 rounded-lg bg-brand-surface border border-brand-border flex items-center justify-center text-slate-400 hover:text-white transition"
                  title="Refresh telemetry"
                >
                  <Icon name="refresh" className="w-3.5 h-3.5" />
                </button>
              </div>
            </header>

            {/* VIEW CONTENT AREA */}

              {/* PAGE 1: OVERVIEW DASHBOARD */}

                      <h1 className="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        Water Infrastructure Command Center
                        <span className="text-xs font-mono font-normal px-2 py-0.5 rounded bg-brand-cyan/10 text-brand-cyan border border-brand-cyan/20">
                          v2.4 LTS
                        </span>
                      </h1>
                      <p className="text-xs text-slate-400 mt-1">
                        Digital twin intelligence for municipal water distribution and sanitation networks.
                      </p>
                    </div>

                    <div className="flex items-center gap-3">
                      <div className="text-right">
                        <div className="text-[10px] uppercase font-mono text-slate-400">Hydraulic Modeling Engine</div>
                        <div className="text-xs font-semibold text-emerald-400 flex items-center justify-end gap-1.5">
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                          Physics-Informed GNN Live
                        </div>
                      </div>
                      <button 
                        onClick={() => setPrintPreviewMode(true)}
                        className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-surface border border-brand-border hover:border-brand-cyan text-slate-300 text-xs transition"
                      >
                        <Icon name="printer" className="w-3.5 h-3.5" />
                        <span>Executive Briefing</span>
                      </button>
                    </div>
                  </div>

                  {/* 6 CORE KPI CARDS */}

                    <div className="bg-brand-surface/80 border border-brand-border rounded-xl p-3.5 shadow-sm hover:border-brand-cyan/40 transition">
                      <div className="flex items-center justify-between text-slate-400 mb-1.5">
                        <span className="text-[11px] font-medium uppercase tracking-wider">Network Length</span>
                        <Icon name="activity" className="w-3.5 h-3.5 text-brand-cyan" />
                      </div>
                      <div className="text-xl font-bold font-mono text-white">{kpis.totalLengthKm} <span className="text-xs font-normal text-slate-400">km</span></div>
                      <div className="text-[10px] text-emerald-400 mt-1 flex items-center gap-1">
                        <span>100% GIS Mapped</span>
                      </div>
                    </div>

                    {/* KPI 2 */}
                    <div className="bg-brand-surface/80 border border-brand-border rounded-xl p-3.5 shadow-sm hover:border-brand-cyan/40 transition">

                        <span className="text-[11px] font-medium uppercase tracking-wider">Monitored Pipes</span>
                        <Icon name="layers" className="w-3.5 h-3.5 text-brand-blue" />
                      </div>
                      <div className="text-xl font-bold font-mono text-white">{kpis.monitoredPipes} <span className="text-xs font-normal text-slate-400">segs</span></div>
                      <div className="text-[10px] text-slate-400 mt-1">

                      </div>
                    </div>

                    {/* KPI 3 */}
                    <div className="bg-brand-surface/80 border border-brand-border rounded-xl p-3.5 shadow-sm hover:border-red-500/40 transition">

                        <span className="text-[11px] font-medium uppercase tracking-wider">Active Anomalies</span>
                        <Icon name="alertTriangle" className="w-3.5 h-3.5 text-red-400" />
                      </div>
                      <div className="text-xl font-bold font-mono text-red-400">{kpis.activeAnomalies} <span className="text-xs font-normal text-slate-400">alerts</span></div>
                      <div className="text-[10px] text-red-400/90 mt-1 flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-red-400 animate-ping"></span>

                    </div>

                    {/* KPI 4 */}
                    <div className="bg-brand-surface/80 border border-brand-border rounded-xl p-3.5 shadow-sm hover:border-amber-500/40 transition">

                        <span className="text-[11px] font-medium uppercase tracking-wider">Water Loss Rate</span>
                        <Icon name="droplets" className="w-3.5 h-3.5 text-amber-400" />
                      </div>
                      <div className="text-xl font-bold font-mono text-amber-400">{kpis.totalLossRate} <span className="text-xs font-normal text-slate-400">m³/h</span></div>
                      <div className="text-[10px] text-slate-400 mt-1 font-mono">

                      </div>

                    <div className="bg-brand-surface/80 border border-brand-border rounded-xl p-3.5 shadow-sm hover:border-brand-cyan/40 transition">

                        <span className="text-[11px] font-medium uppercase tracking-wider">Daily Drain (₹)</span>
                        <Icon name="barChart" className="w-3.5 h-3.5 text-brand-cyan" />
                      </div>
                      <div className="text-xl font-bold font-mono text-white">₹{(kpis.dailyFinancial).toLocaleString('en-IN')}</div>
                      <div className="text-[10px] text-slate-400 mt-1 font-mono">
                        ₹{(kpis.monthlyFinancial).toLocaleString('en-IN')}/mo
                      </div>
                    </div>

                    {/* KPI 6 */}
                    <div className="bg-brand-surface/80 border border-brand-border rounded-xl p-3.5 shadow-sm hover:border-emerald-500/40 transition">
                      <div className="flex items-center justify-between text-slate-400 mb-1.5">
                        <span className="text-[11px] font-medium uppercase tracking-wider">Health Score</span>
                        <Icon name="shieldAlert" className="w-3.5 h-3.5 text-emerald-400" />
                      </div>
                      <div className="text-xl font-bold font-mono text-emerald-400">{kpis.healthScore}%</div>
                      <div className="text-[10px] text-slate-400 mt-1">
                        NRW index: 12.4%
                      </div>
                    </div>
                  </div>

                  {/* MAIN OVERVIEW ROW: DIGITAL TWIN MAP AS HERO + SIDEBAR SUMMARY */}
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    {/* Digital Twin Map Container (Cols 8) */}

                      {/* Map Controls Toolbar */}

                          <span className="font-bold text-white uppercase text-[11px] tracking-wider flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-brand-cyan animate-pulse"></span>
                            Digital Twin Spatial Graph

                          <span className="text-slate-400">|</span>
                          <span className="text-[11px] text-slate-400 font-mono">Schematic Projection</span>

                            Potable Grid

                          <button
                            onClick={() => setLayerSewer(!layerSewer)}

                            Sanitation Layer

                          <button

                          <button
                            onClick={() => {

                              setLayerWater(true);
                              setLayerSewer(true);
                              addToast('Corridor Focused', 'Focused on Parallel Utility Corridor: Potable P-23-24 & Sewer P-23-24-SEW', 'info');
                            }}
                            className="px-2 py-1 rounded text-[11px] font-bold border bg-purple-500/10 border-purple-500/40 text-purple-300 hover:bg-purple-500/20 transition flex items-center gap-1"
                            title="Focus on Parallel Water & Sewage Corridors"
                          >
                            <span className="w-2 h-2 rounded-full bg-purple-400"></span>
                            <span>Parallel Corridors</span>

                          <button

                            <Icon name="maximize" className="w-3 h-3 text-brand-darkest" />
                            <span>Expand Fullscreen</span>
                          </button>
                        </div>
                      </div>

                      {/* Map Visual Component */}
                      <div className="relative h-[480px] bg-brand-darkest bg-grid-pattern overflow-hidden">
                        <DigitalTwinSVGMap
                          nodes={nodes}

                          selectedZone={selectedZone}
                          selectedPipeId={selectedPipeId}
                          onSelectPipe={(id) => { setSelectedPipeId(id); setIsDetailDrawerOpen(true); }}
                          layerWater={layerWater}
                          layerSewer={layerSewer}
                          layerFlowArrows={layerFlowArrows}
                          layerPressureHeatmap={layerPressureHeatmap}
                          layerSensors={layerSensors}
                          lineage={lineage}
                        />

                        {/* Map Floating Legend */}
                        <div className="absolute bottom-3 left-3 bg-brand-surface/90 backdrop-blur border border-brand-border/80 rounded-lg p-2.5 text-[11px] space-y-1 shadow-lg pointer-events-none">
                          <div className="text-[10px] uppercase font-bold text-slate-400 font-mono tracking-wider mb-1">Classification Key</div>
                          <div className="flex items-center gap-2">
                            <span className="w-3 h-1 bg-emerald-400 rounded-full"></span>
                            <span className="text-slate-300">Potable Water Main (Normal)</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="w-3 h-1 bg-amber-400 rounded-full"></span>
                            <span className="text-slate-300">Micro-leak Suspected</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="w-3 h-1 bg-red-500 rounded-full animate-pulse"></span>
                            <span className="text-slate-300">Critical Pipe Burst</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="w-3 h-1 bg-purple-500 rounded-full"></span>
                            <span className="text-slate-300">Sanitation / Parallel Sewer Main</span>
                          </div>
                          <div className="flex items-center gap-2 pt-1 border-t border-brand-border/40">
                            <span className="w-2.5 h-2.5 bg-brand-cyan rotate-45 inline-block border border-brand-darkest"></span>
                            <span className="text-slate-300">IoT Sensor (In-Pipe Dual/Trunk)</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Right Column: Active Critical Alerts & Live Feed (Cols 4) */}
                    <div className="lg:col-span-4 space-y-4 flex flex-col">
                      {/* Active Incidents Card */}
                      <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-4 flex-1 flex flex-col shadow-md">
                        <div className="flex items-center justify-between mb-3">
                          <div className="flex items-center gap-2">
                            <Icon name="shieldAlert" className="w-4 h-4 text-red-400" />
                            <h3 className="text-xs font-bold uppercase tracking-wider text-white">Active Critical Alerts</h3>
                          </div>
                          <span className="text-xs font-mono px-2 py-0.5 rounded-full bg-red-500/20 text-red-400 border border-red-500/30 font-bold">
                            {anomalies.filter(a => a.status !== 'RESOLVED').length} Active

                              <div
                                key={anom.id}
                                onClick={() => handleLocateOnMap(anom.pipeId)}
                                className={`p-3 rounded-lg border text-xs cursor-pointer transition ${
                                  isCurrentSelected 
                                    ? 'bg-brand-surfaceLight border-brand-cyan shadow-sm shadow-cyan-950' 
                                    : 'bg-brand-dark/80 border-brand-border hover:border-slate-500'

                                <div className="flex items-center justify-between gap-1 mb-1">
                                  <span className="font-mono font-bold text-white">{anom.id}</span>

                                <div className="text-[11px] text-slate-300 line-clamp-2 mb-2">
                                  {anom.description}

                                <div className="flex items-center justify-between text-[10px] text-slate-400 font-mono border-t border-brand-border/40 pt-1.5">

                                  <span className="text-brand-cyan font-medium flex items-center gap-1">
                                    Locate <Icon name="chevronRight" className="w-2.5 h-2.5" />
                                  </span>
                                </div>
                              </div>
                            );
                          })}

                      </div>

                      {/* Anomaly Distribution Summary */}
                      <div className="bg-brand-surface/90 border border-brand-border rounded-xl p-4 shadow-md">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 mb-3 flex items-center justify-between">
                          <span>Anomaly Distribution</span>
                          <span className="text-[10px] font-mono text-slate-500">4 Classifications</span>

                            <span className="flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                              Normal Operations
                            </span>

                          <div className="w-full bg-brand-dark rounded-full h-1.5 overflow-hidden">
                            <div className="bg-emerald-400 h-full" style={{ width: `${(pipes.filter(p => p.status === 'NORMAL').length / pipes.length) * 100}%` }}></div>

                            <span className="flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                              Minor Leaks / Degradation

                          <div className="flex items-center justify-between text-slate-300 pt-1">
                            <span className="flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-red-400"></span>
                              Critical Pipe Bursts
                            </span>
                            <span className="font-mono font-semibold text-red-400">{pipes.filter(p => p.status === 'CRITICAL_BURST').length}</span>
                          </div>

                          <div className="flex items-center justify-between text-slate-300 pt-1">
                            <span className="flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-purple-400"></span>
                              Sanitation / Blockages
                            </span>
                            <span className="font-mono font-semibold text-purple-400">{pipes.filter(p => p.status === 'CONTAMINATION_BLOCKAGE').length}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* MATHEMATICAL PRESSURE ANALYSIS TEASER (Inline component) */}
                  <MathematicalPressureCard
                    selectedPipe={selectedPipe}
                    simulatedPressureSlider={simulatedPressureSlider}
                    onSliderChange={setSimulatedPressureSlider}
                    mathAnalysis={mathAnalysis}
                    settings={settings}
                  />
                </div>
              )}

              {/* PAGE 2: DIGITAL TWIN MAP (FULLSCREEN VIEW) */}
              {activeTab === 'map' && (
                <div className="h-[calc(100vh-140px)] flex flex-col bg-brand-surface/90 border border-brand-border rounded-xl overflow-hidden shadow-xl">
                  {/* Top Toolbar */}
                  <div className="p-3 bg-brand-dark border-b border-brand-border flex items-center justify-between flex-wrap gap-3 text-xs">
                    <div className="flex items-center gap-3">
                      <span className="font-bold text-white uppercase text-xs tracking-wider flex items-center gap-2">
                        <Icon name="map" className="w-4 h-4 text-brand-cyan" />
                        Digital Twin GIS Network Graph
                      </span>
                      <span className="px-2 py-0.5 rounded bg-brand-cyan/20 text-brand-cyan font-mono text-[11px]">
                        24 Nodes / 32 Edges
                      </span>
                    </div>

                    {/* Filter and Overlay Controls */}
                    <div className="flex items-center gap-2">
                      <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer bg-brand-surface px-2.5 py-1 rounded border border-brand-border">
                        <input type="checkbox" checked={layerWater} onChange={(e) => setLayerWater(e.target.checked)} className="rounded text-brand-cyan" />
                        Potable Water Mains
                      </label>
                      <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer bg-brand-surface px-2.5 py-1 rounded border border-brand-border">
                        <input type="checkbox" checked={layerSewer} onChange={(e) => setLayerSewer(e.target.checked)} className="rounded text-purple-400" />
                        Sanitation Sewer Network
                      </label>
                      <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer bg-brand-surface px-2.5 py-1 rounded border border-brand-border">
                        <input type="checkbox" checked={layerFlowArrows} onChange={(e) => setLayerFlowArrows(e.target.checked)} className="rounded text-brand-blue" />
                        Directional Flow Vectors
                      </label>
                      <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer bg-brand-surface px-2.5 py-1 rounded border border-brand-border">
                        <input type="checkbox" checked={layerPressureHeatmap} onChange={(e) => setLayerPressureHeatmap(e.target.checked)} className="rounded text-amber-400" />
                        Pressure Contour Glow
                      </label>
                      <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer bg-brand-surface px-2.5 py-1 rounded border border-brand-border">
                        <input type="checkbox" checked={layerSensors} onChange={(e) => setLayerSensors(e.target.checked)} className="rounded text-brand-cyan" />
                        IoT In-Pipe Sensors
                      </label>
                      <button
                        onClick={() => {
                          setSelectedPipeId('P-23-24-SEW');
                          setLayerWater(true);
                          setLayerSewer(true);
                          setIsDetailDrawerOpen(true);
                          addToast('Corridor Focused', 'Focused on Parallel Utility Corridor: Potable P-23-24 & Sewer P-23-24-SEW', 'info');
                        }}
                        className="px-2.5 py-1 rounded text-xs font-bold border bg-purple-500/10 border-purple-500/40 text-purple-300 hover:bg-purple-500/20 transition flex items-center gap-1.5"
                        title="Focus on Parallel Water & Sewage Corridors"
                      >
                        <span className="w-2 h-2 rounded-full bg-purple-400"></span>
                        <span>Parallel Corridors</span>
                      </button>
                      <button
                        onClick={() => setIsDetailDrawerOpen(!isDetailDrawerOpen)}
                        className={`px-3 py-1 rounded font-medium border flex items-center gap-1.5 ${isDetailDrawerOpen ? 'bg-brand-cyan text-brand-darkest font-bold' : 'bg-brand-surface border-brand-border text-slate-300'}`}
                      >
                        <Icon name="sliders" className="w-3.5 h-3.5" />
                        <span>{isDetailDrawerOpen ? 'Hide Inspector' : 'Show Inspector'}</span>
                      </button>
                    </div>
                  </div>

                  {/* Main Map + Right Inspector Area */}
                  <div className="flex-1 flex overflow-hidden relative">
                    <div className="flex-1 bg-brand-darkest bg-grid-pattern relative">
                      <DigitalTwinSVGMap
                        nodes={nodes}
                        pipes={pipes}
                        selectedZone={selectedZone}
                        selectedPipeId={selectedPipeId}
                        onSelectPipe={(id) => { setSelectedPipeId(id); setIsDetailDrawerOpen(true); }}
                        layerWater={layerWater}
                        layerSewer={layerSewer}
                        layerFlowArrows={layerFlowArrows}
                        layerPressureHeatmap={layerPressureHeatmap}
                        layerSensors={layerSensors}
                        lineage={lineage}
                      />
                    </div>

                    {/* Right Inspector Drawer */}
                    {isDetailDrawerOpen && (
                      <div className="w-96 border-l border-brand-border bg-brand-dark overflow-y-auto p-4 z-10 transition-all">
                        <PipeDetailDrawer
                          pipe={selectedPipe}
                          onClose={() => setIsDetailDrawerOpen(false)}
                          onCreateWorkOrder={() => handleCreateWorkOrderFromAnomaly(anomalies.find(a => a.pipeId === selectedPipe.id))}
                          onAcknowledge={() => handleAcknowledgeAnomaly(anomalies.find(a => a.pipeId === selectedPipe.id)?.id)}
                          linkedAnomaly={anomalies.find(a => a.pipeId === selectedPipe.id)}
                          simulatedPressureSlider={simulatedPressureSlider}
                          onSliderChange={setSimulatedPressureSlider}
                          mathAnalysis={mathAnalysis}
                        />
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* PAGE 3: NETWORK HEALTH */}
              {activeTab === 'health' && (
                <NetworkHealthView
                  pipes={pipes}
                  nodes={nodes}
                  kpis={kpis}
                  onSelectPipe={handleLocateOnMap}
                />
              )}

              {/* PAGE 4: AI ANOMALY DETECTION */}
              {activeTab === 'anomalies' && (
                <AnomalyDetectionView
                  anomalies={anomalies}
                  onAcknowledge={handleAcknowledgeAnomaly}
                  onLocateOnMap={handleLocateOnMap}
                  onCreateWorkOrder={handleCreateWorkOrderFromAnomaly}
                  onResolvePrompt={handleResolveAnomalyPrompt}
                />
              )}

              {/* PAGE 5: CONTAMINATION RISKS */}
              {activeTab === 'contamination' && (
                <ContaminationRisksView
                  contaminationPaths={contaminationPaths}
                  pipes={pipes}
                  nodes={nodes}
                  onLocateOnMap={handleLocateOnMap}
                  onInitiateContainment={(pathId) => {
                    setContaminationPaths(prev => prev.map(p => p.id === pathId ? { ...p, status: 'CONTAINMENT_ACTIVE' } : p));
                    addToast('Containment Protocol Activated', `Emergency valve isolation & hyper-chlorination initiated for ${pathId}.`, 'success');
                  }}
                />
              )}

              {/* PAGE 6: WORK ORDERS */}
              {activeTab === 'workorders' && (
                <WorkOrdersView
                  workOrders={workOrders}
                  onUpdateStatus={(woId, status) => {
                    setWorkOrders(prev => prev.map(w => w.id === woId ? { ...w, status } : w));
                    addToast('Work Order Updated', `Status updated to ${status}.`, 'info');
                  }}
                  onCreateNew={() => {
                    setWorkOrderInitialData(null);
                    setShowWorkOrderModal(true);
                  }}
                  onRunDispatch={runSmartDispatchSimulation}
                />
              )}

              {/* PAGE 7: ANALYTICS & REPORTS */}
              {activeTab === 'analytics' && (
                <AnalyticsReportsView
                  pipes={pipes}
                  anomalies={anomalies}
                  kpis={kpis}
                  settings={settings}
                  onExportCSV={handleExportCSV}
                  onPrintReport={() => setPrintPreviewMode(true)}
                />
              )}

              {/* PAGE 8: SETTINGS & CALIBRATION */}
              {activeTab === 'settings' && (
                <SettingsView
                  settings={settings}
                  onSaveSettings={(newSettings) => {
                    setSettings(newSettings);
                    addToast('Settings Saved', 'Hydraulic physics parameters updated.', 'success');
                  }}
                  onResetData={handleResetData}
                  onOpenInjectModal={() => setShowInjectModal(true)}
                />
              )}
            </main>
          </div>

          {/* MODAL: INJECT CUSTOM ANOMALY */}
          {showInjectModal && (
            <InjectAnomalyModal
              pipes={pipes}
              onClose={() => setShowInjectModal(false)}
              onInject={(newAnomaly, updatedPipe) => {
                setAnomalies(prev => [newAnomaly, ...prev]);
                setPipes(prev => prev.map(p => p.id === updatedPipe.id ? updatedPipe : p));
                setSelectedPipeId(updatedPipe.id);
                setShowInjectModal(false);
                addToast('Anomaly Injected', `Synthetic incident ${newAnomaly.id} injected into pipe ${updatedPipe.id}.`, 'error');
              }}
            />
          )}

          {/* MODAL: CREATE WORK ORDER */}
          {showWorkOrderModal && (
            <CreateWorkOrderModal
              initialData={workOrderInitialData}
              pipes={pipes}
              onClose={() => setShowWorkOrderModal(false)}
              onCreate={(newWO) => {
                setWorkOrders(prev => [newWO, ...prev]);
                setShowWorkOrderModal(false);
                addToast('Work Order Created', `Dispatch order ${newWO.id} logged.`, 'success');
              }}
            />
          )}

          {/* MODAL: RESOLVE ANOMALY CONFIRMATION */}
          {resolveModalData && (
            <ResolveAnomalyDialog
              anomaly={resolveModalData}
              onClose={() => setResolveModalData(null)}
              onConfirm={confirmResolveAnomaly}
            />
          )}

          {/* PRINT / EXECUTIVE BRIEFING MODAL */}
          {printPreviewMode && (
            <ExecutiveReportModal
              kpis={kpis}
              anomalies={anomalies}
              pipes={pipes}
              workOrders={workOrders}
              onClose={() => setPrintPreviewMode(false)}
            />
          )}
        </div>
      );
    }

    // --- SUB-COMPONENT: DIGITAL TWIN SVG MAP ENGINE ---
    function DigitalTwinSVGMap({
      nodes,
      pipes,
      selectedZone,
      selectedPipeId,
      onSelectPipe,
      layerWater,
      layerSewer,
      layerFlowArrows,
      layerPressureHeatmap,
      layerSensors = true,
      lineage
    }) {
      const [pan, setPan] = useState({ x: 20, y: 10 });
      const [zoom, setZoom] = useState(1);
      const isDragging = useRef(false);
      const dragStart = useRef({ x: 0, y: 0 });

      // Filtered nodes and pipes
      const visiblePipes = useMemo(() => {
        return pipes.filter(p => {
          if (p.isSanitation && !layerSewer) return false;
          if (!p.isSanitation && !layerWater) return false;
          if (selectedZone !== 'ALL' && p.zone !== selectedZone) return false;
          return true;
        });
      }, [pipes, layerWater, layerSewer, selectedZone]);

      const visibleNodes = useMemo(() => {
        return nodes.filter(n => {
          if (n.isSewage && !layerSewer) return false;
          if (!n.isSewage && !layerWater) return false;
          if (selectedZone !== 'ALL' && n.zone !== selectedZone) return false;
          return true;
        });
      }, [nodes, layerWater, layerSewer, selectedZone]);

      // Node lookup map
      const nodeMap = useMemo(() => {
        const m = {};
        nodes.forEach(n => { m[n.id] = n; });
        return m;
      }, [nodes]);

      // Drag Handlers
      const handleMouseDown = (e) => {
        isDragging.current = true;
        dragStart.current = { x: e.clientX - pan.x, y: e.clientY - pan.y };
      };

      const handleMouseMove = (e) => {
        if (!isDragging.current) return;
        setPan({
          x: e.clientX - dragStart.current.x,
          y: e.clientY - dragStart.current.y
        });
      };

      const handleMouseUp = () => {
        isDragging.current = false;
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        setZoom(z => Math.min(2.5, Math.max(0.5, z * factor)));
      };

      return (
        <div 
          className="w-full h-full cursor-grab active:cursor-grabbing select-none relative"
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onWheel={handleWheel}
        >
          {/* Zoom and Reset Controls Overlay */}
          <div className="absolute top-4 right-4 z-10 flex flex-col gap-1.5 bg-brand-surface/90 border border-brand-border p-1.5 rounded-lg shadow-lg">
            <button
              onClick={() => setZoom(z => Math.min(2.5, z + 0.15))}
              className="p-1.5 rounded hover:bg-brand-surfaceLight text-slate-300 hover:text-white"
              title="Zoom In"
            >
              <Icon name="zoomIn" className="w-4 h-4" />
            </button>
            <button
              onClick={() => setZoom(z => Math.max(0.5, z - 0.15))}
              className="p-1.5 rounded hover:bg-brand-surfaceLight text-slate-300 hover:text-white"
              title="Zoom Out"
            >
              <Icon name="zoomOut" className="w-4 h-4" />
            </button>
            <button
              onClick={() => { setPan({ x: 20, y: 10 }); setZoom(1); }}
              className="p-1.5 rounded hover:bg-brand-surfaceLight text-slate-300 hover:text-white"
              title="Reset View"
            >
              <Icon name="maximize" className="w-4 h-4" />
            </button>
          </div>

          {/* SVG Canvas */}
          <svg className="w-full h-full">
            <defs>
              {/* Arrow markers for flow vectors */}
              <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#20D9F3" />
              </marker>
              <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10B981" />
              </marker>
              <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F59E0B" />
              </marker>
              <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#EF4444" />
              </marker>
              <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#A855F7" />
              </marker>
              {/* Radial glow filter for bursts */}
              <filter id="glow-burst" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            {/* Transform Group */}
            <g transform={`translate(${pan.x}, ${pan.y}) scale(${zoom})`}>
              {/* District Boundary Outlines */}
              <rect x="100" y="40" width="440" height="200" rx="16" fill="rgba(67, 139, 255, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="115" y="60" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 1: NORTH RIDGE RESIDENTIAL</text>

              <rect x="100" y="220" width="500" height="150" rx="16" fill="rgba(32, 217, 243, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="115" y="240" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 2: CENTRAL COMMERCIAL CORE</text>

              <rect x="280" y="360" width="300" height="190" rx="16" fill="rgba(67, 139, 255, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="295" y="380" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 3: CYBERCITY TECH PARK</text>

              <rect x="580" y="170" width="320" height="190" rx="16" fill="rgba(67, 139, 255, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="595" y="190" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 4: INDUSTRIAL EAST CORRIDOR</text>

              <rect x="560" y="360" width="340" height="190" rx="16" fill="rgba(168, 85, 247, 0.02)" stroke="#162338" strokeDasharray="4 4" />
              <text x="575" y="380" fill="#334155" fontSize="11" fontFamily="JetBrains Mono" fontWeight="bold">ZONE 5: SOUTH SANITATION BASIN</text>

              {/* PRESSURE HEATMAP CONTOUR GLOW (When active) */}
              {layerPressureHeatmap && visibleNodes.map(node => {
                const isLowP = node.actualPressure < 2.0;
                const isHighP = node.actualPressure > 5.0;
                const glowColor = isLowP ? 'rgba(239, 68, 68, 0.25)' : isHighP ? 'rgba(67, 139, 255, 0.25)' : 'rgba(16, 185, 129, 0.15)';
                return (
                  <circle
                    key={`contour-${node.id}`}
                    cx={node.x}
                    cy={node.y}
                    r={node.actualPressure * 14}
                    fill={glowColor}
                    filter="blur(16px)"
                  />
                );
              })}

              {/* PIPES (EDGES) */}
              {visiblePipes.map(pipe => {
                const u = nodeMap[pipe.fromNodeId];
                const v = nodeMap[pipe.toNodeId];
                if (!u || !v) return null;

                const isSelected = pipe.id === selectedPipeId;
                const isUpstream = lineage.upstreamPipes.includes(pipe.id);
                const isDownstream = lineage.downstreamPipes.includes(pipe.id);

                // Pipe styling based on status & layer
                let strokeColor = '#10B981'; // normal
                let strokeWidth = Math.max(3, Math.min(8, pipe.diameter / 120));
                let animClass = 'flow-line-normal';
                let markerId = 'arrow-green';

                if (pipe.isSanitation) {
                  strokeColor = '#A855F7';
                  markerId = 'arrow-purple';
                  strokeWidth = 4.5;
                } else if (pipe.status === 'CRITICAL_BURST') {
                  strokeColor = '#EF4444';
                  markerId = 'arrow-red';
                  strokeWidth = 6.5;
                  animClass = 'flow-line-fast';
                } else if (pipe.status === 'MICRO_LEAK') {
                  strokeColor = '#F59E0B';
                  markerId = 'arrow-amber';
                  strokeWidth = 4.5;
                } else if (pipe.status === 'CONTAMINATION_BLOCKAGE') {
                  strokeColor = '#D946EF';
                  markerId = 'arrow-purple';
                  strokeWidth = 5;
                  animClass = 'flow-line-slow';
                }

                // Lineage highlights override
                if (isSelected) {
                  strokeColor = '#20D9F3';
                  strokeWidth = 7;
                  markerId = 'arrow-cyan';
                } else if (isUpstream) {
                  strokeColor = '#38BDF8'; // glowing cyan upstream
                  strokeWidth = 5.5;
                } else if (isDownstream) {
                  strokeColor = '#60A5FA'; // tech blue downstream
                  strokeWidth = 5.5;
                }

                const offset = pipe.parallelOffset || 0;
                const dx = v.x - u.x;
                const dy = v.y - u.y;
                const len = Math.hypot(dx, dy) || 1;
                const nx = (-dy / len) * offset;
                const ny = (dx / len) * offset;
                const p1x = u.x + nx;
                const p1y = u.y + ny;
                const p2x = v.x + nx;
                const p2y = v.y + ny;

                return (
                  <g key={pipe.id} className="cursor-pointer" onClick={() => onSelectPipe(pipe.id)}>
                    {/* Wider hit zone for easy clicking */}
                    <line
                      x1={p1x}
                      y1={p1y}
                      x2={p2x}
                      y2={p2y}
                      stroke="transparent"
                      strokeWidth={strokeWidth + 14}
                    />

                    {/* Pipe background track */}
                    <line
                      x1={p1x}
                      y1={p1y}
                      x2={p2x}
                      y2={p2y}
                      stroke="#0D1422"
                      strokeWidth={strokeWidth + 2}
                      strokeLinecap="round"
                    />

                    {/* Main Pipe Color Line */}
                    <line
                      x1={p1x}
                      y1={p1y}
                      x2={p2x}
                      y2={p2y}
                      stroke={strokeColor}
                      strokeWidth={strokeWidth}
                      strokeLinecap="round"
                      strokeOpacity={isSelected ? 1 : 0.85}
                    />

                    {/* Directional Flow Animation Line */}
                    {layerFlowArrows && (
                      <line
                        x1={p1x}
                        y1={p1y}
                        x2={p2x}
                        y2={p2y}
                        stroke={isSelected ? '#FFFFFF' : strokeColor}
                        strokeWidth={strokeWidth * 0.5}
                        className={animClass}
                        strokeOpacity={0.9}
                        markerEnd={`url(#${markerId})`}
                      />
                    )}

                    {/* IN-PIPE SENSORS: Setup in between nodes to detect sewage & contamination */}
                    {layerSensors && pipe.sensors && pipe.sensors.map(sensor => {
                      const frac = sensor.positionPercent / 100;
                      const sx = p1x + (p2x - p1x) * frac;
                      const sy = p1y + (p2y - p1y) * frac;
                      const isAlarm = sensor.status === 'ALARM_CONTAMINATION';
                      const isWarning = sensor.status === 'WARNING';
                      const sensorFill = isAlarm ? '#EF4444' : isWarning ? '#F59E0B' : '#20D9F3';

                      return (
                        <g key={sensor.id} className="cursor-pointer">
                          {isAlarm && (
                            <circle cx={sx} cy={sy} r="10" fill="rgba(239, 68, 68, 0.45)" stroke="#EF4444" strokeWidth="1.5" className="anim-burst" />
                          )}
                          <rect
                            x={sx - 5.5}
                            y={sy - 5.5}
                            width="11"
                            height="11"
                            rx="2"
                            transform={`rotate(45, ${sx}, ${sy})`}
                            fill={sensorFill}
                            stroke="#080D18"
                            strokeWidth="2"
                          />
                          <circle cx={sx} cy={sy} r="2" fill="#080D18" />
                          <g transform={`translate(${sx}, ${sy - 12})`}>
                            <rect
                              x="-26"
                              y="-8"
                              width="52"
                              height="14"
                              rx="3"
                              fill="#080D18"
                              stroke={isAlarm ? '#EF4444' : '#1E2F48'}
                              strokeWidth="1"
                            />
                            <text
                              x="0"
                              y="2.5"
                              textAnchor="middle"
                              fill={isAlarm ? '#EF4444' : '#20D9F3'}
                              fontSize="7.5"
                              fontFamily="JetBrains Mono"
                              fontWeight="bold"
                            >
                              {isAlarm ? 'â˜£ CONTAM' : `S:${sensor.parameters.freeChlorineMgL}Cl`}
                            </text>
                          </g>
                        </g>
                      );
                    })}

                    {/* Pipe ID Badge on mid-point */}
                    <g transform={`translate(${(p1x + p2x) / 2}, ${(p1y + p2y) / 2})`}>
                      <rect
                        x={pipe.isSanitation ? "-26" : "-20"}
                        y="-9"
                        width={pipe.isSanitation ? "52" : "40"}
                        height="18"
                        rx="4"
                        fill="#080D18"
                        stroke={isSelected ? '#20D9F3' : (pipe.isSanitation ? '#A855F7' : '#1E2F48')}
                        strokeWidth={pipe.isSanitation ? "1.5" : "1"}
                      />
                      <text
                        x="0"
                        y="3"
                        textAnchor="middle"
                        fill={isSelected ? '#20D9F3' : (pipe.isSanitation ? '#C084FC' : '#94A3B8')}
                        fontSize="8"
                        fontFamily="JetBrains Mono"
                        fontWeight="600"
                      >
                        {pipe.id}
                      </text>
                    </g>
                  </g>
                );
              })}

              {/* JUNCTIONS & FACILITY NODES */}
              {visibleNodes.map(node => {
                const isSelectedNode = node.id === lineage.upstreamNodes[0] || node.id === lineage.downstreamNodes[0];

                // Node type styling
                let nodeFill = '#111B2B';
                let nodeStroke = '#20D9F3';
                let nodeRadius = 8;
                let symbolIcon = null;

                if (node.type === 'RESERVOIR_WTP') {
                  nodeFill = '#0284C7';
                  nodeStroke = '#38BDF8';
                  nodeRadius = 13;
                } else if (node.type === 'PUMPING_STATION') {
                  nodeFill = '#2563EB';
                  nodeStroke = '#60A5FA';
                  nodeRadius = 11;
                } else if (node.type === 'STORAGE_TANK') {
                  nodeFill = '#0D9488';
                  nodeStroke = '#2DD4BF';
                  nodeRadius = 10;
                } else if (node.type === 'WASTEWATER_SUMP' || node.type === 'SEWER_CHAMBER') {
                  nodeFill = '#7C3AED';
                  nodeStroke = '#C084FC';
                  nodeRadius = 9;
                }

                // Anomaly pulses
                let pulseEffect = null;
                if (node.status === 'CRITICAL_BURST') {
                  pulseEffect = (
                    <circle cx={node.x} cy={node.y} r="18" fill="rgba(239, 68, 68, 0.4)" stroke="#EF4444" className="anim-burst" />
                  );
                } else if (node.status === 'MICRO_LEAK') {
                  pulseEffect = (
                    <circle cx={node.x} cy={node.y} r="14" fill="rgba(245, 158, 11, 0.3)" stroke="#F59E0B" className="anim-leak" />
                  );
                } else if (node.status === 'CONTAMINATION_BLOCKAGE') {
                  pulseEffect = (
                    <circle cx={node.x} cy={node.y} r="16" fill="rgba(168, 85, 247, 0.35)" stroke="#A855F7" className="anim-contamination" />
                  );
                }

                return (
                  <g key={node.id} transform={`translate(0, 0)`} className="cursor-pointer">
                    {pulseEffect}

                    {/* Outer glow ring for selected lineage */}
                    {isSelectedNode && (
                      <circle cx={node.x} cy={node.y} r={nodeRadius + 6} fill="none" stroke="#20D9F3" strokeWidth="2" strokeDasharray="3 3" />
                    )}

                    

                    {/* Main Node Circle */}
                    <circle
                      cx={node.x}
                      cy={node.y}
                      r={nodeRadius}
                      fill={nodeFill}
                      stroke={nodeStroke}
                      strokeWidth={isSelectedNode ? 3 : 2}
                    />

                    {/* Node Label Text */}
                    <text
                      x={node.x}
                      y={node.y - (nodeRadius + 4)}
                      textAnchor="middle"
                      fill="#CBD5E1"
                      fontSize="9.5"
                      fontFamily="Inter"
                      fontWeight="500"
                    >
                      {node.id}
                    </text>

                    {/* Elevation & Pressure readout pill */}
                    <rect
                      x={node.x - 26}
                      y={node.y + nodeRadius + 3}
                      width="52"
                      height="14"
                      rx="3"
                      fill="#080D18"
                      stroke={node.actualPressure < 2.0 ? '#EF4444' : '#1E2F48'}
                      strokeWidth="1"
                    />
                    <text
                      x={node.x}
                      y={node.y + nodeRadius + 13}
                      textAnchor="middle"
                      fill={node.actualPressure < 2.0 ? '#EF4444' : '#38BDF8'}
                      fontSize="8.5"
                      fontFamily="JetBrains Mono"
                      fontWeight="600"
                    >
                      {`${node.actualPressure.toFixed(2)}b`}
                    </text>
                  </g>
                );
              })}
            </g>
          </svg>
        </div>
      );
    }

    // --- SUB-COMPONENT: PIPE DETAIL DRAWER (RIGHT INSPECTOR) ---
    function PipeDetailDrawer({

    }) {

              <div className="bg-brand-dark p-1.5 rounded border border-brand-border/60 text-center">

              </div>

            {/* Live Interactive Pressure Slider */}
            <div className="pt-2 border-t border-brand-border/40">
              <div className="flex items-center justify-between text-[11px] mb-1">

              <div className="flex justify-between text-[9px] font-mono text-slate-500 mt-1">

            <div className="space-y-1.5 text-[11px]">

                <span>Material:</span>
                <span className="font-medium text-slate-200">{pipe.material}</span>
              </div>
              <div className="flex justify-between text-slate-400">
                <span>Diameter:</span>
                <span className="font-medium text-slate-200">{pipe.diameter} mm</span>
              </div>
              <div className="flex justify-between text-slate-400">
                <span>Length:</span>
                <span className="font-medium text-slate-200">{pipe.length} m</span>

              <div className="flex justify-between text-slate-400">

              </div>
              <div className="flex justify-between text-slate-400">
                <span>Roughness (C):</span>
                <span className="font-medium text-slate-200">{pipe.roughness}</span>
              </div>
              <div className="flex justify-between text-slate-400">
                <span>Soil Surround:</span>
                <span className="font-medium text-slate-200">{pipe.soilCondition || 'Sandy Loam'}</span>

              <div className="flex justify-between text-slate-400">

                <span className="font-mono text-brand-cyan font-bold">{pipe.fromNodeId}</span>

              <div className="flex justify-between text-slate-400">
                <span>Downstream Node:</span>
                <span className="font-mono text-brand-blue font-bold">{pipe.toNodeId}</span>
              </div>
              {pipe.parallelOffset !== undefined && (
                <div className="flex justify-between items-center pt-1 border-t border-brand-border/40">
                  <span className="text-slate-400">Corridor Alignment:</span>
                  <span className="px-2 py-0.5 rounded text-[10px] font-mono font-semibold bg-purple-500/15 text-purple-300 border border-purple-500/30">
                    Parallel Dual-Utility Trench

                </div>

            <div className="bg-brand-surface rounded-xl border border-brand-border p-3 space-y-2.5">

                <div className="text-[10px] uppercase font-mono font-bold text-slate-400 tracking-wider flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-brand-cyan animate-pulse"></span>
                  <span>In-Pipe Online Sensors ({pipe.sensors.length})</span>
                </div>
                <span className="text-[9px] font-mono text-brand-cyan bg-brand-cyan/10 px-1.5 py-0.5 rounded border border-brand-cyan/30">
                  {pipe.fromNodeId} â†” {pipe.toNodeId}
                </span>
              </div>

              <div className="space-y-2">
                {pipe.sensors.map(sensor => {
                  const isAlarm = sensor.status === 'ALARM_CONTAMINATION';
                  const isWarning = sensor.status === 'WARNING';
                  const badgeStyle = isAlarm
                    ? 'bg-red-500/20 text-red-400 border-red-500/40'
                    : isWarning
                    ? 'bg-amber-500/20 text-amber-400 border-amber-500/40'
                    : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40';

                  return (
                    <div
                      key={sensor.id}
                      className={`p-2.5 rounded-lg border text-[11px] space-y-1.5 ${
                        isAlarm ? 'bg-red-500/10 border-red-500/40' : 'bg-brand-dark border-brand-border/80'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="font-mono font-bold text-white flex items-center gap-1">
                          <span className={isAlarm ? 'text-red-400' : 'text-brand-cyan'}>â—†</span>
                          {sensor.id}
                          <span className="text-slate-400 font-normal text-[10px]">({sensor.positionPercent}% span)</span>
                        </span>
                        <span className={`px-1.5 py-0.5 rounded text-[9px] font-mono font-bold border ${badgeStyle}`}>
